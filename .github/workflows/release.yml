name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch        # bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags
#
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere, and the
# package gets a provenance attestation linking it to this workflow run.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg)"; exit 1
          fi
      - run: npm test
      - run: npm publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand on GitHub (which is what created the tag) is left as it is.
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
