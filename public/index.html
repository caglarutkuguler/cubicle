  .act.bad:hover { background:#5a252c; }
  .errbox { margin-top:6px; padding:6px 8px; border-radius:6px; background:#3a1a1f; border:1px solid #6a2a32; color:#ffc4c9; font-size:12px; }
  .errbox b { display:block; margin-bottom:2px; }
  .card .errbox pre { display:none; }          /* the full excerpt is in the agent's panel */
  .errbox code { display:inline-block; margin-top:3px; font-size:11px; color:#ffdfe2; background:rgba(0,0,0,.25); padding:0 4px; border-radius:3px; }
  .errbox pre { margin:4px 0 0; max-height:7.5em; overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:11px; color:#f3d6d9; background:rgba(0,0,0,.25); padding:4px 6px; border-radius:4px; }
  #detail a, .card a { text-decoration:underline; text-decoration-color:rgba(158,197,255,.4); text-underline-offset:2px; }
  #looks input[type=text] { width:100%; box-sizing:border-box; background:#1d2030; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  #zoomui { position:absolute; right:8px; bottom:8px; z-index:3; display:flex; gap:4px; }
  #zoomui button { background:rgba(34,37,54,.9); color:var(--text); border:1px solid var(--line); border-radius:6px; width:28px; height:26px; cursor:pointer; font:inherit; }
  body.kiosk #detail, body.kiosk #zoomui, body.kiosk #news { display:none !important; }
  .steps { margin-top:6px; font-size:12px; }
  .steps summary { cursor:pointer; color:var(--muted); }
  .steps ol { margin:4px 0 0; padding-inline-start:18px; }
  .steps li { color:var(--text); }
  .steps li span { color:var(--muted); }
  .card b.pick { cursor:pointer; }
  #news { position:fixed; right:16px; bottom:16px; z-index:6; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; box-shadow:0 8px 24px rgba(0,0,0,.35); max-width:320px; }
  #news button { background:none; border:0; color:var(--muted); cursor:pointer; margin-inline-start:8px; }
  [dir="rtl"] .card .edit { margin-left:0; margin-right:auto; }
  [dir="rtl"] #settings { right:auto; left:0; }
  [dir="rtl"] #news { right:auto; left:16px; }
  footer { color:var(--muted); font-size:12px; margin-top:12px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cubicle <small id="co"></small></h1>
    <div class="right">
      <select id="company" hidden></select>
      <span id="nav"></span>
      <span id="status"></span>

  <div id="banner"></div>
  <div id="main">

  </div>
  <div id="news" hidden></div>

  <dialog id="kpi"></dialog>

  const params = new URLSearchParams(location.search);

  const savedLang = (() => { try { return JSON.parse(localStorage.getItem('cubicle.settings') || '{}').lang || ''; } catch (_) { return ''; } })();
  const wantLang = (params.get('lang') || savedLang || navigator.language || 'en').slice(0, 2).toLowerCase();
  const lang = STR[wantLang] ? wantLang : 'en';
  const L = STR[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  const KIOSK = params.has('kiosk');
  // ⚙ view toggles (the settings object is read lazily; a kiosk always animates).
  function animOn() { try { return KIOSK || settings.anim !== false; } catch (_) { return true; } }
  function cardsOn() { try { return settings.cards !== false; } catch (_) { return true; } }

  // reads its API directly on the same origin, with the signed-in user's own access.
  const EMBED = params.get('embed') === 'paperclip';
  if (KIOSK) document.body.classList.add('kiosk');
  // ?widget: a small office inside another page (Paperclip's dashboard): kiosk without the header.
  if (params.has('widget')) document.body.classList.add('widget');

  // ---------- setup ----------
  const T = 16, CW = 352;
  let CH = 208;                        // grows with the number of desk rows
  const cv = document.getElementById('c');
  let g = cv.getContext('2d');        // the pixel theme draws on whatever canvas `g` points at (see themes.pixel)
  const stageEl = document.getElementById('stage');
  const labelsEl = document.getElementById('labels');
  const cardsEl = document.getElementById('cards');
  const statusEl = document.getElementById('status');
  const companySel = document.getElementById('company');
  document.getElementById('hint').textContent = L.hint;
  statusEl.textContent = L.connecting;

  // Office layout, in tiles. Three rows of four desks by default; whenever there are more
  // agents than desks the office grows by another row (and more lounge spots), so nobody
  // ever has to share a desk.
  const BASE_DESKS = [[1,3],[4.5,3],[8,3],[11.5,3],[1,7.5],[4.5,7.5],[8,7.5],[11.5,7.5],[1,10.5],[4.5,10.5],[8,10.5],[11.5,10.5]];
  const BASE_LOUNGE = [[16,4.4],[18,4.4],[20,4.4],[16.2,10],[18.3,10.6],[20.3,10],[15.8,7.4],[21,7.4],[17,12],[19.5,12],[16.4,5.6],[19.6,5.6]];
  let DESKS = BASE_DESKS, LOUNGE = BASE_LOUNGE, ROWS = 3;
  function layoutFor(n) {
    const rows = Math.max(3, Math.ceil(n / 4));
    if (rows === ROWS) return;
    ROWS = rows;
    DESKS = BASE_DESKS.slice(); LOUNGE = BASE_LOUNGE.slice();
    for (let r = 1; r <= rows - 3; r++) {
      const y = 10.5 + 3.5 * r;
      DESKS.push([1, y], [4.5, y], [8, y], [11.5, y]);
      LOUNGE.push([16, y + 1], [17.8, y + 2], [19.6, y + 1], [21, y + 2]);
    }
    CH = (13 + (rows - 3) * 3.5) * T;
    resizeCanvas();
  }
  function resizeCanvas() {
    const k = theme ? theme.scale : 1;
    cv.width = CW * k; cv.height = CH * k;
    cv.style.imageRendering = theme && theme.smooth ? 'auto' : 'pixelated';
    stageEl.style.aspectRatio = `${CW} / ${CH}`;
    stageEl.style.setProperty('--ar', String(CW / CH));
    fitLayout();
  }

  // ---------- header: Paperclip and the KPI board ----------
  // Paperclip opens in its own tab (one tab, reused), unless the office is already framed inside it.
  const navEl = document.getElementById('nav');
  function renderNav() {
    if (KIOSK || !navEl) return;
    const framed = EMBED && window.top !== window;
    const pc = pcLink() && company && !DEMO && !framed;
    const kpi = DEMO || (paperclipUrl && company);
    const html = (kpi ? `<button type="button" class="navb" data-nav="kpi" title="${esc(L.kpiTitle)}">📊 KPI</button>` : '')
      + (pc ? `<a class="navb" href="${esc(pcLink())}/${esc(company.issuePrefix)}/dashboard" target="cubicle-paperclip" rel="noopener" title="${esc(L.openPaperclip)}">Paperclip ↗</a>` : '');

      + `<p><button type="button" class="act" data-tg="tsserve">📱 ${esc(L.tsServe)}</button></p><p class="muted small">${esc(L.tsServeNote)}</p><div data-tg="tsfail"></div>`;

      + step(1, L.tg1, `<p>${esc(L.tg1Text)}</p><p><a class="act" href="https://t.me/BotFather" target="_blank" rel="noopener">✈ @BotFather</a></p>`, st.on)

    if (st.on && !st.chats) tgTimer = setInterval(async () => {

  async function saveTgAccess(change) {

  // ---------- layout: the office fits the window ----------
  // A big office grows taller (more desk rows). Instead of running off the bottom of the window,
  // it keeps its shape and fits the height that is left; on a wide window the cards move beside
  // it. ⚙ Layout: auto, side by side, or the old cards-below at full width.
  const mainEl = document.getElementById('main');
  function fitLayout() {
    if (!mainEl) return;
    const b = document.body;
    let mode = 'auto'; try { mode = settings.layout || 'auto'; } catch (_) {}
    if (KIOSK || !animOn() || mode === 'stack') { b.classList.remove('fit', 'side'); return; }
    b.classList.add('fit');
    const W = mainEl.clientWidth, ar = CW / CH, gap = 12, cardsMin = mode === 'side' ? 240 : 300;
    const top = mainEl.getBoundingClientRect().top + window.scrollY;
    const availH = Math.max(300, window.innerHeight - top - 14);
    // auto: the whole office fits the page, both its width and the window's height, as large as it
    // can be, with the cards below; 'height' fits the height with the cards beside it when there
    // is room; 'side' always puts them beside.
    if (mode === 'auto') {
      b.classList.remove('side');
      const w = Math.max(240, Math.min(W, availH * ar + 4));
      mainEl.style.setProperty('--stage-w', Math.floor(w) + 'px');
      mainEl.style.setProperty('--stage-h', Math.floor((w - 4) / ar + 4) + 'px');
      try { clampCam(); } catch (_) {}
      return;
    }
    const fitW = Math.min(W, availH * ar + 4);                     // + the stage border
    const side = cardsOn() && (mode === 'side' ? W >= 640 : W >= 980 && W - fitW - gap >= cardsMin);
    const w = Math.max(240, side ? Math.min(fitW, W - gap - cardsMin) : fitW);
    b.classList.toggle('side', side);
    mainEl.style.setProperty('--stage-w', Math.floor(w) + 'px');
    mainEl.style.setProperty('--stage-h', Math.floor((w - 4) / ar + 4) + 'px');
    try { clampCam(); } catch (_) {}
  }
  window.addEventListener('resize', () => fitLayout());
  const SHIRTS = ['#e05d5d','#4f9dde','#57b86b','#e0a33b','#a66de0','#3bc4c4','#e07ab8','#9aa0b4','#f07b3f','#6fcf97','#c9b458','#5f7ee0'];
  const HAIRS  = ['#2b1d14','#111111','#6b3e1f','#c9a04a','#8b4513','#3b2a20','#d9d0c1','#4a2b1a'];
  const SKINS  = ['#f1c7a3','#d9a47a','#b87b52','#f5d5b8','#c68e62'];

  let paperclipUrl = '';
  let pcLinkBase = null;   // where Paperclip links point for this browser ('' = Paperclip cannot be opened from here)
  const pcLink = () => (pcLinkBase === null ? paperclipUrl : pcLinkBase);
  let companies = [];
  let company = null;
  const sprites = new Map();

  const hash = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- data sources ----------
  async function getJSON(u) { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }

  // Each provider loads { agents, issues, label } from one source. Several providers can
  // share one office (--source paperclip,claude-code); feed agent ids are namespaced so they
  // never collide with Paperclip ids.
  function paperclipProvider() {
    const p = {
      kind: 'paperclip', label: 'Paperclip',
      async load() {
        if (!company) {
          companies = await getJSON('/api/companies');
          if (!companies.length) return { agents: [], issues: [], label: '', note: L.noCompany };
          const want = params.get('company');
          company = companies.find((c) => c.issuePrefix === want || c.id === want) || companies[0];
          if (companies.length > 1 && !EMBED) {
            companySel.hidden = false;
            companySel.innerHTML = companies.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
            companySel.value = company.id;
          }
        }
        const [agents, issues, runs] = await Promise.all([
          getJSON(`/api/companies/${company.id}/agents`),
          // Open issues only; the Cubicle server filters these itself, Paperclip can do it for us.
          getJSON(`/api/companies/${company.id}/issues${EMBED ? '?status=backlog,todo,in_progress,in_review,blocked' : ''}`),
          // The latest runs, for the error of a failed one (optional: older servers and replays lack it).
          getJSON(`/api/companies/${company.id}/heartbeat-runs${EMBED ? '?limit=60&summary=1' : ''}`).catch(() => []),
        ]);
        const fails = lastFailures(runs);
        for (const a of agents) a.lastFail = fails.get(a.id) || null;
        p.label = company.name;
        return { agents, issues, label: company.name };
      },
    };
    return p;
  }

  // An agent's latest finished run, when it failed: what the panel shows as its error.
  const FAILED_RUNS = new Set(['failed', 'error', 'timed_out']);
  function lastFailures(runs) {
    // The newest run of each agent by start time, finished or not: once a new run has started, the
    // last one's failure is history and the card stops showing it.
    const when = (r) => String(r.startedAt || r.createdAt || r.finishedAt || '');
    const latest = new Map();
    for (const r of Array.isArray(runs) ? runs : []) {
      if (!r || !r.agentId || !when(r)) continue;
      const cur = latest.get(r.agentId);
      if (!cur || when(r) > when(cur)) latest.set(r.agentId, r);
    }
    const out = new Map();
    for (const [id, r] of latest) if (FAILED_RUNS.has(r.status)) out.set(id, {
      runId: r.id, code: r.errorCode || r.status, error: r.error ? String(r.error).slice(0, 500) : '',
      stderr: r.stderrExcerpt ? String(r.stderrExcerpt).slice(-600) : '', at: Date.parse(r.finishedAt) || Date.now(),
    });
    return out;
  }

  // Generic feed (docs/FEED.md): { company?, agents: [{ id, name, role?, status, task?, error? }] } or a bare array.
  const STATUS_ALIASES = {
    running: 'running', working: 'running', busy: 'running', active: 'running',
    idle: 'idle', done: 'idle', finished: 'idle', ready: 'idle',
    error: 'error', failed: 'error', crashed: 'error',
    paused: 'paused', sleeping: 'paused', stopped: 'paused', offline: 'paused',
    waiting: 'waiting', blocked: 'waiting', needs_input: 'waiting', permission: 'waiting',
  };
  function feedProvider(path, label) {
    const p = {
      kind: 'feed', label, claude: label === 'Claude Code',
      async load() {
        const raw = await getJSON(path);
        const list = Array.isArray(raw) ? raw : Array.isArray(raw?.agents) ? raw.agents : [];
        if (raw && raw.company) p.label = String(raw.company);
        const agents = list.map((a, i) => {
          const t = a.task;
          const task = !t ? null : typeof t === 'string'
            ? { identifier: '', title: t, url: a.taskUrl || '' }
            : { identifier: String(t.id ?? t.identifier ?? ''), title: t.title ?? '', url: t.url || '' };
          return {
            id: `${path}#${a.id ?? a.name ?? i}`, name: String(a.name ?? a.id ?? `agent ${i + 1}`),
            title: a.role || a.title || '', createdAt: String(a.since ?? a.createdAt ?? i).padStart(20, '0'),
            status: STATUS_ALIASES[String(a.status || 'idle').toLowerCase()] || 'idle',
            errorReason: a.error || null, task,
            parent: a.parent ? `${path}#${a.parent}` : null, recent: Array.isArray(a.recent) ? a.recent : null,
          };
        });
        return { agents, issues: [], label: p.label };
      },
    };
    return p;
  }

  function demoProvider() {
    const t0 = Date.now();
    const roster = [
      ['CEO', 'Chief Executive'], ['WebDev', 'Web Developer'], ['SEO', 'SEO & Content'],
      ['Growth', 'Growth Marketer'], ['Analyst', 'Functional Analyst'], ['QA', 'QA & Refactoring'],
    ];
    const tasks = ['Audit site health', 'Keyword research', 'Qualified leads shortlist', 'Review checkout flow', 'Refactor module', 'Write test checklist'];
    const spend = [[420, 2000], [1250, 2000], [2000, 2000], [1830, 2000], [0, 0], [610, 1000]];   // cents: spent, budget
    // ?demo=20 shows a bigger office (up to 48 agents), e.g. to try the layout.
    const want = Math.max(1, Math.min(48, parseInt(params.get('demo'), 10) || 6));
    const ROLES = ['Backend Engineer', 'Frontend Engineer', 'Designer', 'Data Analyst', 'Support', 'DevOps', 'Researcher', 'Writer'];
    for (let i = roster.length; i < want; i++) { roster.push([`Agent ${i + 1}`, ROLES[i % ROLES.length]]); tasks.push(`Task ${i + 1}`); spend.push([0, 0]); }
    roster.length = tasks.length = spend.length = want;
    const agents = roster.map(([name, title], i) => ({
      id: `demo-${i}`, name, title, createdAt: `2026-01-01T00:${String(i).padStart(2, '0')}:00Z`, status: 'idle', errorReason: null,
      spentMonthlyCents: spend[i][0], budgetMonthlyCents: spend[i][1],
    }));
    function tick() {
      const s = Math.floor((Date.now() - t0) / 1000);
      agents.forEach((a, i) => {
        const phase = Math.floor((s + i * 7) / (9 + i * 2)) % 5;
        a.status = phase === 4 && i === 2 ? 'error' : phase === 3 && i === 3 ? 'waiting' : phase % 2 === 0 ? 'running' : 'idle';
        a.errorReason = a.status === 'error' ? 'Example error: connection lost' : null;
      });
    }
    return {
      kind: 'demo', label: 'Demo Co.',
      async load() {
        tick();
        if (!company) company = { id: 'demo', name: 'Demo Co.', issuePrefix: 'DEMO' };
        // Every 30 s the Analyst hands its task to QA and back, to show a hand-off.
        const passed = Math.floor((Date.now() - t0) / 30000) % 2 === 1;
        const issues = agents.map((a, i) => ({ identifier: `DEMO-${i + 1}`, title: tasks[i], status: 'in_progress', assigneeAgentId: i === 4 && passed ? agents[5].id : a.id }));
        return { agents: agents.map((a) => ({ ...a })), issues, label: 'Demo Co.' };
      },
    };
  }

  let providers = [];

  let redacted = false;   // server runs with --redact: titles/commands never reach the page
  let replayClock = null; // server plays back a recording (--source replay:file): show its clock

  async function init() {
    const b = document.getElementById('banner');

      paperclipUrl = location.origin;

    } else if (!DEMO) {

        const cfg = await getJSON('/config.json');

        if (cfg.replay) replayClock = { ...cfg.replay, loadedAt: Date.now() };
        const list = cfg.sources || [cfg.source === 'feed'
          ? { kind: 'feed', label: cfg.label, path: '/api/feed' }
          : { kind: 'paperclip', paperclipUrl: cfg.paperclipUrl }];
        providers = list.map((x) => {
          if (x.kind === 'paperclip') { paperclipUrl = x.paperclipUrl || ''; if ('paperclipLinks' in cfg) pcLinkBase = cfg.paperclipLinks || ''; return paperclipProvider(); }
          return feedProvider(x.path || '/api/feed', x.label || 'feed');
        });
        // Reload when the server was updated or restarted.
        if (cfg.build) setInterval(async () => {
          try { if ((await getJSON('/config.json')).build !== cfg.build) location.reload(); } catch (_) {}
        }, 60000);
      } catch (_) {
        // No Cubicle server behind this page: show the demo instead of an error.
        DEMO = true;
        b.innerHTML = L.hosted; b.style.display = 'block';

    } else {
      b.innerHTML = L.demo; b.style.display = 'block';

    if (DEMO) providers = [demoProvider()];
    await loadLooks();
    if (!panel.hidden) renderSettings();

    setInterval(poll, 4000);

  }

  function timeText() {
    if (!replayClock) return new Date().toLocaleTimeString(lang);
    const r = replayClock, span = Math.max(1, r.to - r.from + (r.hold || 0));
    const at = r.from + ((r.at - r.from) + (Date.now() - r.loadedAt) * r.speed) % span;
    return `▶ ${L.replay} ${new Date(at).toLocaleString(lang, { weekday: 'short', hour: '2-digit', minute: '2-digit' })} ×${r.speed}`;
  }

  function failureText(p, e) {

    return (code === 401 || code === 403) ? L.denied(code) : L.unreachable;
  }

  async function poll() {
    const results = await Promise.allSettled(providers.map((p) => p.load()));
    const agents = [], issues = [], labels = [], failed = [], notes = [];
    results.forEach((r, i) => {
      if (r.status === 'rejected') { failed.push(i); return; }
      r.value.agents.forEach((a) => { a._src = i; });
      agents.push(...r.value.agents);
      issues.push(...r.value.issues);
      if (r.value.label) labels.push(r.value.label);
      if (r.value.note) notes.push(r.value.note);
    });
    if (failed.length === providers.length) {
      statusEl.textContent = failureText(providers[0], results[0].reason);
      return;
    }
    document.getElementById('co').textContent = labels.join(' · ');
    if (!/github\.io$/.test(location.hostname)) document.title = labels.length ? `Cubicle · ${labels.join(' · ')}` : 'Cubicle';
    officeName = labels[0] || '';
    renderNav();
    sync(agents, issues);
    deepLink();
    if (!DEMO) {
      const b = document.getElementById('banner');
      if (!agents.length && providers.some((p) => p.kind === 'feed')) {

    const needYou = [...sprites.values()].filter((x) => x.status === 'waiting' || x.ask).length;
    const down = failed.map((i) => `⚠ ${providers[i].label}: ${failureText(providers[i], results[i].reason)}`);
    statusEl.textContent = [
      notes.length && !agents.length ? notes.join(' ') : L.summary(agents.length, running),

  }

  companySel.addEventListener('change', () => {
    company = companies.find((c) => c.id === companySel.value);
    for (const s of sprites.values()) s.el.remove();
    sprites.clear();
    const u = new URL(location.href); u.searchParams.set('company', company.issuePrefix); history.replaceState(null, '', u);
    poll();
  });

  function currentTask(agentId, issues) {
    const mine = issues.filter((i) => i.assigneeAgentId === agentId);

      const f = mine.find((i) => i.status === st);

    return null;
  }

  // A review path waiting on a person: the board or a user, or an interaction (questions,

  function asksPerson(x) { return !!x && (/board|user|human/i.test(String(x.responder || '')) || x.kind === 'interaction'); }

  // interaction for a human) means the agent needs you, even though Paperclip reports it idle.
  function askingBoard(agentId, issues) {
    for (const i of issues) {
      if (i.assigneeAgentId !== agentId || ['done', 'cancelled'].includes(i.status)) continue;
      const paths = (i.reviewAttention && i.reviewAttention.paths) || [];
      const p = paths.find(asksPerson);
      if (p) return { issue: i, reason: String(p.label || '') };
    }
    return null;
  }

  function sync(agents, issues) {
    const shift = humanOn() ? 1 : 0;      // the human sits at the first desk
    layoutFor(agents.length + shift);
    const sorted = [...agents].sort((a, b) => ((a._src || 0) - (b._src || 0)) || String(a.createdAt).localeCompare(String(b.createdAt)));
    const seen = new Set();
    sorted.forEach((a, idx) => {
      seen.add(a.id);
      let s = sprites.get(a.id);
      if (!s) {
        const h = hash(a.id);
        const spot = LOUNGE[idx % LOUNGE.length];

          id: a.id, idx, seed: (h % 1000) / 100,
          // Looks come from the id, so an agent keeps its colours when others join or leave.
          // (>>> keeps the index positive: h is an unsigned 32-bit hash.)
          baseShirt: SHIRTS[(h >>> 6) % SHIRTS.length], baseHair: HAIRS[h % HAIRS.length], baseSkin: SKINS[(h >>> 3) % SKINS.length],
          x: spot[0] * T, y: spot[1] * T,

      s.urlKey = a.urlKey !== undefined ? a.urlKey || '' : undefined;

  let synced = false;

  // Hand-offs: when an issue moves from one agent to another between two polls, both walk to

  function setBubble(s, text, cls = '', secs = 4) {

  function taskLink(t) {

    // A plain click opens it in the dialog over the office; Ctrl/⌘-click still opens a tab.

  }

  // Monthly spend from Paperclip, when it reports any: "$4.20 / $20.00", amber from 80 %, red at 100 %.
  const money = (cents) => new Intl.NumberFormat(lang, { style: 'currency', currency: 'USD' }).format(cents / 100);
  function spendHtml(s) {
    if (!s.spent && !s.budget) return '';

    const col = share >= 1 ? '#ff8a8a' : share >= 0.8 ? '#ffd27a' : 'var(--muted)';
    const text = s.budget ? L.spend(money(s.spent), money(s.budget)) : L.spendNoBudget(money(s.spent));

  }

  // What an agent asks you (Paperclip interactions: questions with options), fetched once per
  // half minute per issue and shown on its card and panel, so it can be read on any screen.
  const qCache = new Map();

        .then((r) => (r.ok ? r.json() : [])).catch(() => [])
        .then((list) => {
          entry.list = (Array.isArray(list) ? list : []).filter((x) => x && (x.status || 'pending') === 'pending').map((x) => ({
            title: x.title || '', questions: ((x.questions || (x.payload && x.payload.questions)) || []).map((q) => ({ prompt: q.prompt || '', options: (q.options || []).map((o) => ({ label: o.label || '', description: o.description || '' })), other: !!q.allowOther })),
          })).filter((x) => x.title || x.questions.length);

  }
  function questionsHtml(list, full) {
    if (!list || !list.length) return '';

        + (q.options.length ? `<ol class="qo">${q.options.map((o) => `<li>${esc(o.label)}${full && o.description ? `<small>${esc(o.description)}</small>` : ''}</li>`).join('')}</ol>` : '')).join('')).join('') + '</div>';
  }

  function renderCards() {
    fitLayout();                           // the banner or the company list may have moved the office
    const rank = (s) => (narrow() ? (answerIssue(s) || s.status === 'waiting' ? 0 : s.status === 'error' ? 1 : 2) : 0);
    const list = [...sprites.values()].sort((a, b) => rank(a) - rank(b) || a.idx - b.idx);
    const desks = !animOn() && cardsOn();
    cardsEl.innerHTML = list.map((s) => `<div class="card">${desks ? `<canvas class="desk" data-id="${esc(s.id)}"></canvas>` : ''}${cardHtml(s)}</div>`).join('');
    if (desks) cardsEl.querySelectorAll('canvas.desk').forEach((el) => { const s = sprites.get(el.dataset.id); if (s) drawDeskCard(el, s); });
    if (cam.sel) renderDetail();
  }

  // Animation off: each card shows its agent sitting at its desk, drawn once per update with the
  // current theme (the room around the desk included), so a busy screen costs nothing between polls.
  const DESK_VIEW = [46, 36];           // office pixels around a desk: 46 wide, 36 high
  function drawDeskCard(el, s) {
    const d = s.desk || DESKS[0];
    const k = theme.scale * Math.min(2, window.devicePixelRatio || 1) * 1.6;
    const [vw, vh] = DESK_VIEW;
    el.width = Math.round(vw * k); el.height = Math.round(vh * k);
    const gc = el.getContext('2d');
    // Office pixels -> this canvas: the desk's top-left sits 6 px in, 14 px down.
    const ox = d[0] * T - 6, oy = d[1] * T - 14;
    gc.setTransform(k, 0, 0, k, -ox * k, -oy * k);

    const ghost = { ...s, x: d[0] * T + 22, y: d[1] * T + 12, walking: false, seated: true, typing: s.status === 'running', dir: 0, bubble: null };
    const c = { g: gc, t: 0, T, CW, CH, night: hr < 7 || hr >= 20, opts: themeOpts, sprites: new Map([[s.id, ghost]]), desks: [d], lounge: LOUNGE, company: '', lang,

      gc.save(); gc.beginPath(); gc.rect(ox, oy, vw, vh); gc.clip();

  // ---------- movement ----------
  function targetFor(s, now) {
    if (s.meetUntil > now) return [s.meetSpot[0] * T, s.meetSpot[1] * T, false];
    if (s.queueIdx >= 0) { const q = queueSpots()[s.queueIdx]; if (q) return [q[0], q[1], false]; }
    if (s.chat && s.status === 'idle') return s.chat.a === s ? [...s.chat.spot, false] : [...s.chat.stay, false];
    if (s.status === 'running' || s.status === 'error' || s.status === 'waiting') return [s.desk[0] * T + 22, s.desk[1] * T + 12, true];
    if (now > s.nextWander) {
      const used = new Set([...sprites.values()].filter((o) => o !== s).map((o) => o.lounge));
      const free = LOUNGE.map((_, i) => i).filter((i) => !used.has(i));
      if (free.length) s.lounge = free[Math.floor(Math.random() * free.length)];
      s.nextWander = now + 9 + Math.random() * 14;

  function step(s, dt, now) {

    // Walk around desks and through the doorway: a path is planned when the target changes.

  // ---------- walking: shortest paths around desks and walls ----------

  const CELL = 8;

        for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g.beginPath(); g.moveTo(tx + Math.cos(a) * r * 0.4, ty + Math.sin(a) * r * 0.4); g.lineTo(tx + Math.cos(a) * r, ty + Math.sin(a) * r); g.stroke(); }
      }
      g.restore();
    }
  }

  // ---------- what an agent is doing, as an icon ----------
  const TOOL_ICONS = [
    [/^(edit|multiedit|write|apply_patch|replace|write_file|notebookedit)$/, '✏️'],
    [/^(read|read_file|read_many_files|view_image|notebookread)$/, '📖'],
    [/^(bash|shell|run_shell_command|exec_command|exec|killshell|bashoutput)$/, '▶'],
    [/^(grep|glob|search|search_file_content|list_directory|ls|find)$/, '🔎'],
    [/^(webfetch|websearch|web_fetch|web_search|google_web_search|fetch)$/, '🌐'],
    [/^(task|agent)$/, '👥'],
    [/^(todowrite|update_plan|write_todos)$/, '✅'],
  ];
  function toolIcon(t) {
    if (!t || t.identifier) return '⌨';
    const word = String(t.title || '').replace(/^allow\s+/, '').split(/[\s:]/)[0].toLowerCase();
    const hit = TOOL_ICONS.find(([re]) => re.test(word));
    return hit ? hit[1] : '⌨';
  }

  // ---------- small talk: two idle agents at the same spot chat for a moment ----------
  // ---------- the human desk (⚙, optional): you sit at the first desk, agents who need you queue ----------
  // in front of it instead of raising a hand at their own desks.
  function humanOn() { try { return !!settings.human; } catch (_) { return false; } }
  const HUMAN_ID = '__you';
  const human = { id: HUMAN_ID, realName: '', name: '', role: '', status: 'idle', x: 0, y: 0, seated: true, walking: false, typing: false, dir: 0,
    baseShirt: '#3d6fd9', baseHair: '#3b2a20', baseSkin: '#d9a47a', seed: 4.2, idx: -1, look: {} };
  let humanEl = null;
  function placeHuman(waiting) {
    const d = DESKS[0];
    human.realName = L.you;
    human.x = d[0] * T + 22; human.y = d[1] * T + 12;
    human.status = waiting ? 'running' : 'idle'; human.typing = waiting > 0; human.seated = true;
    applyLook(human);
    if (!humanEl) {
      humanEl = document.createElement('div'); humanEl.className = 'lbl human';
      humanEl.innerHTML = '<div class="bub wait" style="display:none"></div><div class="name"></div>';
      labelsEl.appendChild(humanEl);
    }
    const k = cv.clientWidth / CW;
    humanEl.style.display = '';
    humanEl.style.left = (human.x * k) + 'px'; humanEl.style.top = ((human.y - 20) * k) + 'px';
    humanEl.querySelector('.name').textContent = '🧑 ' + human.name;
    const b = humanEl.querySelector('.bub');
    if (waiting) { b.textContent = L.queue(waiting); b.style.display = ''; } else b.style.display = 'none';
  }
  function hideHuman() { if (humanEl) humanEl.style.display = 'none'; }
  // Where the line forms: in front of the human desk, along the aisle towards the doorway.
  let queueKey = '', queueList = [];
  function queueSpots() {
    const key = `${DESKS.length}:${CH}:${theme.id}`;
    if (key === queueKey) return queueList;
    const w = walkGrid(), d = DESKS[0], y = d[1] * T + 36, out = [];
    const free = (x, yy) => { const cx = Math.floor(x / CELL), cy = Math.floor(yy / CELL); return cx >= 0 && cy >= 0 && cx < w.cols && cy < w.rows && !w.solid[cy * w.cols + cx]; };
    for (let x = d[0] * T + 17; x < 14 * T - 4 && out.length < 12; x += 18) if (free(x, y)) out.push([x, y]);
    queueKey = key; queueList = out;
    return out;
  }

  // ---------- conversations: two agents on a break stand side by side and talk ----------
  // The one who starts walks up next to the other; they face each other and take turns, and what
  // they say comes from the office itself: work just finished, what is next, who is waiting or failing.
  const CHAT_GAP = 19, LINE_SECS = 3.4;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const short = (t, n = 34) => (t && t.length > n ? t.slice(0, n - 1) + '…' : t || '');
  function standFree(x, y) {
    const w = walkGrid(), cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
    return x > 15 * T + 4 && x < CW - 8 && y > 3 * T && y < CH - 6 && !w.solid[cy * w.cols + cx];
  }
  function chatScript(a, b) {
    const t = L.talk; if (!t) return null;
    const others = [...sprites.values()].filter((o) => o !== a && o !== b);
    const topics = [];
    if (a.lastDone && Date.now() - a.lastDone.at < 20 * 60000 && a.lastDone.id)
      topics.push([[0, t.doneA(a.lastDone.id)], [1, t.doneB], [0, pick(t.doneC)], [1, t.doneD]]);
    if (b.task && b.task.identifier)
      topics.push([[0, t.nextA(b.name)], [1, t.nextB(b.task.identifier, short(b.task.title))], [0, t.nextC]]);
    const w = others.find((o) => o.status === 'waiting' || o.ask);
    if (w) { const id = (w.ask ? w.ask.issue : w.task || {}).identifier; topics.push([[0, t.waitA(w.name)], [1, t.waitB(id)]]); }
    const e = others.find((o) => o.status === 'error');
    if (e) topics.push([[0, t.errA(e.name)], [1, t.errB]]);
    const busy = others.filter((o) => o.status === 'running').length;
    if (busy >= 2) topics.push([[0, t.busyA(busy)], [1, t.busyB]]);
    if (b.role) topics.push([[0, t.roleA(short(b.role, 26))], [1, pick(t.roleB)]]);
    if (L.pairs && L.pairs.length) { const [q, r] = pick(L.pairs); topics.push([[0, q], [1, r]]); }
    return topics.length ? pick(topics) : null;
  }
  const onBreak = (o, now) => o.status === 'idle' && !o.chat && !o.seated && o.x > 15 * T && !(o.meetUntil > now);
  function startChat(a, now) {
    if (!onBreak(a, now) || now - (a.lastChat || 0) < 35) return false;
    const mates = [...sprites.values()].filter((o) => o !== a && onBreak(o, now) && !o.walking && now - (o.lastChat || 0) > 35)
      .sort((p, q) => Math.hypot(p.x - a.x, p.y - a.y) - Math.hypot(q.x - a.x, q.y - a.y));
    for (const b of mates) {
      const side = [Math.sign(a.x - b.x) || 1, -(Math.sign(a.x - b.x) || 1)].find((sd) => standFree(b.x + sd * CHAT_GAP, b.y));
      if (!side) continue;
      const lines = chatScript(a, b); if (!lines) return false;
      a.chat = b.chat = { a, b, lines, i: 0, next: 0, spot: [b.x + side * CHAT_GAP, b.y], stay: [b.x, b.y], until: now + 30 + lines.length * LINE_SECS };
      return true;
    }
    return false;
  }
  function endChat(c, now) {
    for (const o of [c.a, c.b]) { o.chat = null; o.lastChat = now; o.nextWander = now + 4 + Math.random() * 6; }
  }
  // Called once per frame for each conversation (from its starter).
  function runChat(c, now) {
    const { a, b } = c;
    if (a.status !== 'idle' || b.status !== 'idle' || !sprites.has(a.id) || !sprites.has(b.id) || now > c.until) { endChat(c, now); return; }
    const there = !a.walking && !b.walking && Math.hypot(a.x - c.spot[0], a.y - c.spot[1]) < 2;
    if (!there) return;
    a.dir = Math.sign(b.x - a.x); b.dir = -a.dir;         // look at each other
    if (now < c.next) return;
    if (c.i >= c.lines.length) { endChat(c, now); return; }
    const [who, text] = c.lines[c.i++];
    setBubble(who ? b : a, text, 'talk', LINE_SECS - 0.2);
    c.next = now + LINE_SECS;
  }

  // ---------- the last steps, for cards and the detail panel ----------
  const openSteps = new Set();
  function ago(ms) {
    const m = Math.round((Date.now() - ms) / 60000);
    try { return new Intl.RelativeTimeFormat(lang, { numeric: 'auto', style: 'short' }).format(-m, 'minute'); } catch (_) { return `${m} min`; }
  }
  function stepsHtml(s) {
    if (!s.recent || !s.recent.length) return '';
    const items = [...s.recent].reverse().map(([t, text, d]) => `<li>${esc(text)} <span>· ${esc(ago(t))}${Number.isFinite(d) ? ` · ${(d / 1000).toFixed(d < 10000 ? 1 : 0)} s` : ''}</span></li>`).join('');
    return `<details class="steps" data-id="${esc(s.id)}"${openSteps.has(s.id) ? ' open' : ''}><summary>${esc(L.lastSteps)} (${s.recent.length})</summary><ol>${items}</ol></details>`;
  }
  cardsEl.addEventListener('toggle', (e) => {
    const d = e.target; if (!d.dataset || !d.dataset.id) return;
    if (d.open) openSteps.add(d.dataset.id); else openSteps.delete(d.dataset.id);
  }, true);

  // ---------- zoom, pan, and following one agent ----------
  const viewEl = document.getElementById('view'), detailEl = document.getElementById('detail'), zoomUi = document.getElementById('zoomui');
  const cam = { z: 1, x: 0, y: 0, follow: null, sel: null };   // follow: the camera tracks; sel: the panel
  function clampCam() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    cam.z = Math.max(1, Math.min(4, cam.z));
    cam.x = Math.min(0, Math.max(w - w * cam.z, cam.x)); cam.y = Math.min(0, Math.max(h - h * cam.z, cam.y));
    viewEl.style.transform = cam.z === 1 ? '' : `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
    stageEl.classList.toggle('zoomed', cam.z > 1);
  }
  function zoomAtPoint(z, px, py) {
    const nz = Math.max(1, Math.min(4, z));
    cam.x = px - (px - cam.x) * (nz / cam.z); cam.y = py - (py - cam.y) * (nz / cam.z); cam.z = nz; clampCam();
  }
  function resetCam() { cam.z = 1; cam.x = cam.y = 0; cam.follow = cam.sel = null; detailEl.hidden = true; clampCam(); }
  function officePoint(clientX, clientY) {
    const r = stageEl.getBoundingClientRect(), k = cv.clientWidth / CW;
    return [((clientX - r.left - cam.x) / cam.z) / k, ((clientY - r.top - cam.y) / cam.z) / k];
  }
  function spriteAt(ox, oy) {
    let best = null, bd = 1e9;
    if (humanOn() && Math.abs(human.x - ox) <= 8 && oy >= human.y - 24 && oy <= human.y + 3) return human;
    for (const s of sprites.values()) {
      if (Math.abs(s.x - ox) > 8 || oy < s.y - 24 || oy > s.y + 3) continue;
      const d = Math.abs(s.x - ox) + Math.abs(s.y - 10 - oy); if (d < bd) { bd = d; best = s; }
    }
    return best;
  }
  function select(s) {
    cam.follow = cam.sel = s ? s.id : null;
    if (s && cam.z < 2.2) cam.z = 2.2;
    renderDetail();
  }
  function followCam() {
    if (!cam.follow) return;
    const s = sprites.get(cam.follow); if (!s) { cam.follow = null; return; }
    const k = cv.clientWidth / CW, w = stageEl.clientWidth, h = stageEl.clientHeight;
    const tx = w / 2 - s.x * k * cam.z, ty = h / 2 - (s.y - 10) * k * cam.z;
    cam.x += (tx - cam.x) * 0.12; cam.y += (ty - cam.y) * 0.12; clampCam();
  }
  // Where the agent's last Paperclip run is shown (its log), and the agent page (to rename it there).
  const runUrl = (s) => (s.lastFail && s.lastFail.runId && pcLink() && company && !DEMO
    ? `${pcLink()}/${encodeURIComponent(company.issuePrefix)}/agents/${encodeURIComponent(s.urlKey || s.id)}/runs/${encodeURIComponent(s.lastFail.runId)}` : '');
  const agentUrl = (s) => (s.urlKey !== undefined && pcLink() && company && !DEMO
    ? `${pcLink()}/${encodeURIComponent(company.issuePrefix)}/agents/${encodeURIComponent(s.urlKey || s.id)}` : '');
  // The error to show: the agent's own error text, or its last Paperclip run when that one failed.
  function errorBox(s) {
    const f = s.lastFail;
    if (!(s.status === 'error' && s.error) && !f) return '';
    const head = f ? L.lastFail(ago(f.at)) : L.error;
    const msg = (s.status === 'error' && s.error) || (f && f.error) || '';
    return `<div class="errbox"><b>⚠ ${esc(head)}</b>${msg ? `<div>${esc(msg)}</div>` : ''}${f && f.code ? `<code>${esc(f.code)}</code>` : ''}${f && f.stderr ? `<pre>${esc(f.stderr)}</pre>` : ''}</div>`;
  }
  function cardHtml(s, panel = false) {
    const t = s.task;
    const taskHtml = t ? `${taskLink(t)} ${esc(t.title)}` : `<span style="color:var(--muted)">${L.noTask}</span>`;
    const note = s.status === 'waiting' && s.waitReason ? `<div class="st" style="color:#ffe08a">✋ ${esc(s.waitReason)}</div>`
      : s.ask ? `<div class="st" style="color:#ffe08a">✋ ${L.asks} ${taskLink(s.ask.issue)} ${esc(s.ask.issue.title)}</div>` : '';
    const reply = !panel && answerable(s) ? `<button type="button" class="reply" data-id="${esc(s.id)}">✋ ${esc(L.reply)}</button>` : '';
    const id = esc(s.id);
    const qlist = questionsFor(s);
    const acts = panel ? `<div class="acts">${[
      qlist && qlist.length ? `<button type="button" class="act warn" data-act="questions" data-id="${id}">❓ ${esc(L.qShow)}</button>` : '',
      answerable(s) ? `<button type="button" class="act warn" data-act="reply" data-id="${id}">✋ ${esc(L.reply)}</button>` : '',
      issueUrl(t) && !answerable(s) ? `<button type="button" class="act" data-act="task" data-id="${id}">📄 ${esc(L.openTask)}</button>` : '',
      agentUrl(s) ? `<button type="button" class="act" data-act="chat" data-id="${id}">💬 ${esc(L.chat)}</button>` : '',
      runUrl(s) ? `<button type="button" class="act bad" data-act="run" data-id="${id}">⚠ ${esc(L.openRun)}</button>` : '',
      `<button type="button" class="act" data-act="look" data-id="${id}">✎ ${esc(L.looksName)}</button>`,
    ].join('')}</div>` : '';
    // Seen from a phone while Paperclip runs on 127.0.0.1: say why there is no Answer button.
    const away = pcLinkBase === '' && paperclipUrl && answerIssue(s) ? `<div class="st" style="color:var(--muted);font-size:12px;margin-top:6px">ⓘ ${esc(L.pcAway)}</div>` : '';
    const nick = s.realName && s.realName !== s.name ? ` <span class="real">(${esc(s.realName)})</span>` : '';
    return `<div class="top"><span class="sw" style="background:${esc(s.shirt)}"></span><b class="pick" data-id="${id}">${esc(s.name)}</b>${nick}${panel ? '' : `<button type="button" class="edit" data-id="${id}" title="${esc(L.looksName)}" aria-label="${esc(L.looksName)}">✎</button>`}</div>
        <div class="role">${esc(s.role)}${spendHtml(s)}</div>
        <div class="st"><span class="pill p-${esc(s.status)}">${esc(L[s.status] || s.status)}</span>${taskHtml}${reply}</div>${note}${errorBox(s)}${stepsHtml(s)}${acts}${away}`;
  }
  // The panel belongs to the selected agent (cam.sel), not to the camera: zooming, panning or the
  // wheel stop the camera from following but keep the panel next to its agent. It is placed right,
  // left, below or above the agent, whichever fits, and hides while the agent is out of view.
  function placeDetail() {
    const s = cam.sel && sprites.get(cam.sel);
    if (!s || detailEl.hidden) return;
    // On a phone the panel is a sheet at the bottom of the screen, over the cards, not the office.
    if (narrow()) { detailEl.classList.add('sheet'); detailEl.style.left = detailEl.style.top = ''; detailEl.style.visibility = ''; return; }
    detailEl.classList.remove('sheet');
    const k = cv.clientWidth / CW, W = stageEl.clientWidth, H = stageEl.clientHeight, z = k * cam.z, m = 8, gap = 10;
    const box = { l: cam.x + (s.x - 8) * z, r: cam.x + (s.x + 8) * z, t: cam.y + (s.y - 30) * z, b: cam.y + (s.y + 2) * z };
    const seen = box.r > 0 && box.l < W && box.b > 0 && box.t < H;
    detailEl.style.visibility = seen ? '' : 'hidden';
    if (!seen) return;
    const pw = detailEl.offsetWidth, ph = detailEl.offsetHeight, cx = (box.l + box.r) / 2, cy = (box.t + box.b) / 2;
    const clampX = (x) => Math.max(m, Math.min(W - pw - m, x)), clampY = (y) => Math.max(m, Math.min(H - ph - m, y));
    const spots = [[box.r + gap, clampY(cy - ph / 2)], [box.l - gap - pw, clampY(cy - ph / 2)], [clampX(cx - pw / 2), box.b + gap], [clampX(cx - pw / 2), box.t - gap - ph]];
    const fits = ([x, y]) => x >= m && y >= m && x + pw <= W - m && y + ph <= H - m;
    const overlap = ([x, y]) => Math.max(0, Math.min(x + pw, box.r) - Math.max(x, box.l)) * Math.max(0, Math.min(y + ph, box.b) - Math.max(y, box.t));
    const [x, y] = spots.find(fits) || spots.map(([x2, y2]) => [clampX(x2), clampY(y2)]).sort((a, b) => overlap(a) - overlap(b))[0];
    detailEl.style.left = Math.round(x) + 'px'; detailEl.style.top = Math.round(y) + 'px';
  }

  // Answering without leaving the office: Paperclip's own issue page in a dialog. Cubicle sends
  // nothing itself; the answer goes through Paperclip's page as if it were opened in a tab.
  const answerDlg = document.getElementById('answer');
  function openPaperclip(url, title, note = '') {
    if (!url) return;
    answerDlg.querySelector('.head b').textContent = title;
    const a = answerDlg.querySelector('.head a'); a.href = url; a.textContent = L.openInPaperclip;
    const x = answerDlg.querySelector('.x'); x.textContent = '✕'; x.setAttribute('aria-label', L.close);
    const n = answerDlg.querySelector('.note'); n.textContent = note; n.hidden = !note;
    answerDlg.querySelector('iframe').src = url;
    if (!answerDlg.open) answerDlg.showModal();
  }
  // The question in full, in its own window: opened by clicking an agent with its hand up.
  const qDlg = document.getElementById('qdlg');
  function openQuestions(s) {
    const list = questionsFor(s); if (!list || !list.length) return false;
    const i = answerIssue(s), id = esc(s.id);
    qDlg.innerHTML = `<h2>✋ ${esc(L.qAsks(s.name))}<button type="button" data-q="close" aria-label="${esc(L.close)}">✕</button></h2>`
      + (i ? `<div class="sub">${taskLink(i)} ${esc(i.title || '')}</div>` : '')
      + questionsHtml(list, true)
      + `<div class="acts">${answerable(s) ? `<button type="button" class="act warn" data-q="reply" data-id="${id}">✋ ${esc(L.reply)}</button>` : ''}</div>`
      + (pcLinkBase === '' && paperclipUrl ? `<p class="sub" style="margin-top:10px">ⓘ ${esc(L.pcAway)}</p>` : '');
    if (!qDlg.open) qDlg.showModal();
    return true;
  }
  qDlg.addEventListener('click', (e) => {
    if (e.target === qDlg || e.target.closest('[data-q="close"]')) { qDlg.close(); return; }
    const r = e.target.closest('[data-q="reply"]'); if (r) { const s = sprites.get(r.dataset.id); qDlg.close(); if (s) openAnswer(s); return; }
    const a = e.target.closest('a[data-issue]'); if (a && !e.ctrlKey && !e.metaKey) { e.preventDefault(); const s = [...sprites.values()].find((x) => answerIssue(x) && answerIssue(x).identifier === a.dataset.issue); qDlg.close(); if (s) openAnswer(s); }
  });
  // Clicking an agent with its hand up opens its question; the first click may have to wait for it.
  function selectAndAsk(s) {
    select(s);
    if (!s || KIOSK || !answerIssue(s)) return;
    if (!openQuestions(s)) setTimeout(() => { if (cam.sel === s.id) openQuestions(s); }, 700);
  }
  function openAnswer(s) {
    const t = answerIssue(s);
    openPaperclip(issueUrl(t), `${L.replyTitle(s.name)} · ${t.identifier}${t.title ? ' ' + t.title : ''}`, L.replyNote);
  }
  function act(kind, s) {
    if (kind === 'questions') openQuestions(s);
    else if (kind === 'reply') openAnswer(s);
    else if (kind === 'task' && s.task) openPaperclip(issueUrl(s.task), `${s.name} · ${s.task.identifier}${s.task.title ? ' ' + s.task.title : ''}`);
    else if (kind === 'run') openPaperclip(runUrl(s), `${s.name} · ${L.lastFail(ago(s.lastFail.at))}`);
    else if (kind === 'look') openLooks(s);
    else if (kind === 'chat') openPaperclip(`${agentUrl(s).replace(/\/agents\//, '/chats/')}`, L.chatTitle(s.name), L.chatNote);
  }
  answerDlg.querySelector('.x').addEventListener('click', () => answerDlg.close());
  answerDlg.addEventListener('click', (e) => { if (e.target === answerDlg) answerDlg.close(); });   // backdrop
  answerDlg.addEventListener('close', () => { answerDlg.querySelector('iframe').src = 'about:blank'; poll(); });

  function narrow() { return window.innerWidth <= 640 && !KIOSK; }
  function renderDetail() {
    const s = cam.sel && sprites.get(cam.sel);
    if (!s || KIOSK) { detailEl.hidden = true; if (cam.sel && !s) cam.sel = null; return; }
    detailEl.innerHTML = `<button type="button" class="x" title="${esc(L.close)}" aria-label="${esc(L.close)}">✕</button>` + cardHtml(s, true);
    detailEl.hidden = false;
    placeDetail();
  }
  detailEl.addEventListener('click', (e) => {
    if (e.target.closest('.x')) { select(null); return; }
    const r = e.target.closest('[data-act]'); if (r) { const s = sprites.get(r.dataset.id); if (s) act(r.dataset.act, s); return; }
    const b = e.target.closest('.edit'); if (b) { const s = sprites.get(b.dataset.id); if (s) openLooks(s); }
  });
  detailEl.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.id) { if (d.open) openSteps.add(d.dataset.id); else openSteps.delete(d.dataset.id); } }, true);
  if (!KIOSK) {
    zoomUi.hidden = false;
    zoomUi.addEventListener('click', (e) => {
      const z = e.target.dataset.z, w = stageEl.clientWidth / 2, h = stageEl.clientHeight / 2;
      // Zoom around the selected agent when there is one, so it stays in view.
      const s = cam.sel && sprites.get(cam.sel), k = cv.clientWidth / CW;
      const px = s ? cam.x + s.x * k * cam.z : w, py = s ? cam.y + (s.y - 12) * k * cam.z : h;
      if (z === 'in') zoomAtPoint(cam.z * 1.4, px, py); else if (z === 'out') zoomAtPoint(cam.z / 1.4, px, py); else resetCam();
    });
    stageEl.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey && cam.z === 1 && e.deltaY > 0) return;       // let the page scroll when not zoomed
      e.preventDefault();
      const r = stageEl.getBoundingClientRect();
      cam.follow = null; zoomAtPoint(cam.z * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    let drag = null;
    stageEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#detail, #zoomui')) return;
      drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
    });
    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) drag.moved = true;
      if (drag.moved && cam.z > 1) { cam.follow = null; cam.x = drag.cx + e.clientX - drag.x; cam.y = drag.cy + e.clientY - drag.y; stageEl.classList.add('panning'); clampCam(); }
    });
    window.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const wasClick = !drag.moved; drag = null; stageEl.classList.remove('panning');
      if (!wasClick || e.target.closest('#detail, #zoomui')) return;
      const [ox, oy] = officePoint(e.clientX, e.clientY);
      const hit = spriteAt(ox, oy);
      if (hit === human) {
        // Your desk: the first agent in line, or your own look when nobody is waiting.
        const first = [...sprites.values()].find((x) => x.queueIdx === 0);
        if (first) selectAndAsk(first); else openLooks(human);
      } else selectAndAsk(hit);
    });
    stageEl.addEventListener('dblclick', (e) => { if (!e.target.closest('#detail, #zoomui')) resetCam(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !dlg.open && !answerDlg.open && !qDlg.open) resetCam(); });
    cardsEl.addEventListener('click', (e) => {
      const b = e.target.closest('b.pick'); if (!b || !animOn()) return;
      const s = sprites.get(b.dataset.id); if (!s) return;
      select(s); stageEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    window.addEventListener('resize', clampCam);
  }

  cardsEl.addEventListener('click', (e) => {
    const r = e.target.closest('.reply'); if (!r) return;
    const s = sprites.get(r.dataset.id); if (s) openAnswer(s);
  });
  detailEl.addEventListener('pointerdown', (e) => e.stopPropagation());   // clicks in the panel never pan the office
  function issueClick(e) {
    const a = e.target.closest('a[data-issue]');
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    openPaperclip(a.href, `${a.dataset.issue}${a.dataset.title ? ' ' + a.dataset.title : ''}`);
  }
  detailEl.addEventListener('click', issueClick);
  cardsEl.addEventListener('click', issueClick);

  // ---------- after an update: what's new ----------
  function whatsNew(version) {
    if (!version || KIOSK || DEMO) return;
    let prev = null;
    try { prev = localStorage.getItem('cubicle.version'); localStorage.setItem('cubicle.version', version); } catch (_) { return; }
    if (!prev || prev === version) return;
    const el = document.getElementById('news');
    el.innerHTML = `${esc(L.whatsNew(version))} <a href="https://github.com/caglarutkuguler/cubicle/releases/tag/v${esc(version)}" target="_blank" rel="noopener">${esc(L.whatsNewLink)}</a><button type="button" aria-label="${esc(L.cancel)}">✕</button>`;
    el.querySelector('button').onclick = () => { el.hidden = true; };
    el.hidden = false;
  }

  // ---------- drawing ----------
  const rect = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };

  function drawRoom(t) {
    const hr = new Date().getHours();
    const night = hr < 7 || hr >= 20;
    for (let y = 2; y < CH / T; y++) for (let x = 0; x < 22; x++) {
      const lounge = x >= 15;
      rect((x + y) % 2 ? (lounge ? '#4a3d57' : '#3a3f56') : (lounge ? '#463a52' : '#363b51'), x * T, y * T, T, T);
    }
    rect('#5b4a6b', 16.5 * T, 6.3 * T, 4.6 * T, 3 * T);
    rect('#4b4f6b', 0, 0, CW, 2 * T);
    rect('#3a3d55', 0, 2 * T - 3, CW, 3);
    for (const wx of [1.5, 5.5, 9.5, 16.5]) {
      rect('#2c2f44', wx * T - 1, 5, 34, 18);
      rect(night ? '#1c2a4a' : '#8fc7ff', wx * T, 6, 32, 16);
      if (!night) { const cx = (t * 3 + wx * 11) % 44 - 8; rect('rgba(255,255,255,.85)', wx * T + cx, 11, 8, 3); rect('rgba(255,255,255,.85)', wx * T + cx + 2, 9, 4, 2); }
      else rect('#f5f1c8', wx * T + 24, 9, 3, 3);
      rect('#2c2f44', wx * T + 15, 6, 2, 16);
    }
    // wall clock
    rect('#e9e7f2', 13 * T, 7, 12, 12); rect('#4b4f6b', 13 * T + 1, 8, 10, 10);
    const now = new Date();
    const hand = (a, len) => { g.beginPath(); g.moveTo(13 * T + 6, 13); g.lineTo(13 * T + 6 + Math.sin(a) * len, 13 - Math.cos(a) * len); g.stroke(); };
    g.strokeStyle = '#e9e7f2'; g.lineWidth = 1;
    hand(((now.getHours() % 12) + now.getMinutes() / 60) / 12 * Math.PI * 2, 3);
    hand(now.getMinutes() / 60 * Math.PI * 2, 4);
    // glass partition with a doorway
    rect('rgba(160,200,255,.18)', 14 * T + 6, 2 * T, 4, 4 * T);
    rect('rgba(160,200,255,.18)', 14 * T + 6, 8 * T, 4, CH - 8 * T);
    rect('#6c7090', 14 * T + 6, 2 * T, 4, 2); rect('#6c7090', 14 * T + 6, 8 * T, 4, 2);
  }

  function loungeProps(t, list) {
    list.push({ z: 3.6 * T, f: () => {
      rect('#6a3f8f', 15.8 * T, 2.4 * T, 5 * T, 12); rect('#7d4fa6', 15.8 * T, 2.4 * T + 12, 5 * T, 8);
      for (let i = 0; i < 4; i++) rect('#9467bd', 16 * T + i * 19, 2.4 * T + 13, 16, 5);
    }});
    list.push({ z: 3.4 * T, f: () => {
      rect('#3b3e4d', 21.1 * T, 2.2 * T, 12, 20); rect('#23252f', 21.1 * T + 2, 2.2 * T + 8, 8, 6);
      rect(Math.floor(t * 2) % 2 ? '#ff5a5a' : '#8a2a2a', 21.1 * T + 9, 2.2 * T + 3, 2, 2);
    }});
    list.push({ z: 6.9 * T, f: () => {
      rect('#8b5a2b', 17 * T, 6.9 * T, 3.6 * T, 1.6 * T); rect('#6e4520', 17 * T, 8.5 * T, 3.6 * T, 3);
      rect('#e9e7f2', 17.4 * T, 7.2 * T, 10, 7); rect('#e9e7f2', 19.4 * T, 7.4 * T, 8, 6);
    }});
    const H = CH / T;
    for (const [px, py] of [[14.9, 2.3], [21.3, H - 1.4], [0.2, H - 0.9]]) list.push({ z: (py + 1) * T, f: () => {
      rect('#8b5a2b', px * T + 3, py * T + 10, 8, 6);
      rect('#3f9d55', px * T + 1, py * T, 12, 11); rect('#57b86b', px * T + 3, py * T - 3, 8, 6);
    }});
  }

  function drawDesk(d, s, t) {
    const x = d[0] * T, y = d[1] * T;
    const on = s && s.typing;
    const err = s && s.status === 'error' && s.seated;
    const wait = s && s.status === 'waiting' && s.seated;
    rect('#8b5a2b', x, y + 8, 34, 10); rect('#6e4520', x, y + 18, 34, 3);
    rect('#6e4520', x + 1, y + 21, 2, 6); rect('#6e4520', x + 31, y + 21, 2, 6);
    rect('#22252f', x + 3, y - 2, 14, 10);
    rect(err ? (Math.floor(t * 2) % 2 ? '#ff6b6b' : '#a33') : wait ? (Math.floor(t) % 2 ? '#e0a33b' : '#b07d20') : on ? '#5cc8f0' : '#3a4050', x + 4, y - 1, 12, 7);
    if (on) for (let i = 0; i < 3; i++) rect('rgba(255,255,255,.75)', x + 5, y + i * 2, (Math.floor(t * 9 + i * 4) % 9) + 1, 1);
    rect('#22252f', x + 9, y + 8, 2, 1);
    rect('#c9cbd6', x + 17, y + 10, 11, 2);
    if (on) rect('#ffffff', x + 17 + (Math.floor(t * 12) % 10), y + 10, 1, 1);
    rect('#f3f3f3', x + 29, y + 9, 3, 4); rect('#f3f3f3', x + 32, y + 10, 1, 2);
  }

  function drawChar(s, t) {
    const x = Math.round(s.x), y = Math.round(s.y);
    const bob = s.walking ? Math.floor(t * 8 + s.seed) % 2 : 0;
    const lk = s.look || {};
    rect('rgba(0,0,0,.25)', x - 4, y - 1, 8, 2);
    if (!s.seated) {
      const ph = s.walking ? Math.floor(t * 8 + s.seed) % 2 : 0;
      const leg = lk.bottom === 'skirt' ? s.skin : '#2b2f45';
      rect(leg, x - 3, y - 5, 2, ph ? 4 : 5);
      rect(leg, x + 1, y - 5, 2, ph ? 5 : 4);
      if (lk.shoes === 'heels') { rect('#1a1a1a', x - 3, y - 1, 2, 1); rect('#1a1a1a', x + 1, y - 1, 2, 1); }
    }
    rect(s.shirt, x - 4, y - 11 - bob, 8, 6);
    if (lk.bottom === 'skirt' && !s.seated) rect('#2b2f45', x - 4, y - 6 - bob, 8, 2);
    if (s.typing) {
      const a = Math.floor(t * 10 + s.seed) % 2;
      rect(s.skin, x - 5, y - 8 - bob - a, 2, 2);
      rect(s.skin, x + 3, y - 8 - bob - (1 - a), 2, 2);
    } else if (s.status === 'waiting' && s.seated) {
      // one hand up, waving
      const w = Math.floor(t * 3 + s.seed) % 2;
      rect(s.skin, x - 5, y - 10 - bob, 1, 4);
      rect(s.skin, x + 4 + w, y - 19 - bob, 2, 8);
    } else {
      rect(s.skin, x - 5, y - 10 - bob, 1, 4);
      rect(s.skin, x + 4, y - 10 - bob, 1, 4);
    }
    const slump = s.status === 'error' && s.seated ? 1 : 0;
    if (photoHead(g, s, x, y - 14.5 - bob + slump, 4.6)) return;
    if (lk.hair === 'long') { rect(s.hair, x - 4, y - 17 - bob + slump, 1, 6); rect(s.hair, x + 3, y - 17 - bob + slump, 1, 6); }
    rect(s.skin, x - 3, y - 17 - bob + slump, 6, 6);
    if (lk.hair !== 'bald') {
      rect(s.hair, x - 3, y - 18 - bob + slump, 6, 2);
      rect(s.hair, x - 3, y - 17 - bob + slump, 1, 2);
      rect(s.hair, x + 2, y - 17 - bob + slump, 1, 2);
      if (lk.hair === 'bun') rect(s.hair, x - 1, y - 20 - bob + slump, 2, 2);
      if (lk.hair === 'curly') { rect(s.hair, x - 4, y - 18 - bob + slump, 1, 2); rect(s.hair, x + 3, y - 18 - bob + slump, 1, 2); }
      if (lk.hair === 'pony') rect(s.hair, x + 3, y - 16 - bob + slump, 1, 4);
    }
    if (((t + s.seed) % 4) >= 0.14) {
      const ox = s.dir || 0;
      rect('#1a1a1a', x - 2 + ox, y - 14 - bob + slump, 1, 1);
      rect('#1a1a1a', x + 1 + ox, y - 14 - bob + slump, 1, 1);
    }
  }

  // ---------- themes ----------
  // A theme draws the office; movement, labels and cards are shared. 'pixel' is built in;
  // others live in public/themes/<id>.js, are loaded only when chosen, and register
  // themselves with window.CubicleThemes.register(). Coordinates are in office pixels
  // (22×13+ tiles of 16 px); a theme with scale > 1 gets a sharper canvas to draw on.
  const themes = {
    pixel: {
      // Drawn at 3× with no smoothing: the same pixel art, but photo heads and logos stay sharp.
      id: 'pixel', name: { en: 'Pixel (classic)', tr: 'Piksel (klasik)', de: 'Pixel (klassisch)', es: 'Píxel (clásico)', fr: 'Pixel (classique)', zh: '像素（经典）', ar: 'بكسل (كلاسيكي)' }, scale: 3, smooth: false, logoSpot: [11.75 * T, 5, 18, 18],
      // Each draws on c.g: the office, the appearance preview or a desk card.
      drawRoom: (c) => onCanvas(c, () => drawRoom(c.t)),
      props: (c, list) => loungeProps(c.t, list),
      drawDesk: (c, d, s) => onCanvas(c, () => drawDesk(d, s, c.t)),
      drawChar: (c, s) => onCanvas(c, () => drawChar(s, c.t)),
    },
  };
  function onCanvas(c, fn) { const main = g; g = c.g; try { fn(); } finally { g = main; } }
  let theme = themes.pixel;
  let themeOpts = {};
  window.CubicleThemes = { register(t) { themes[t.id] = t; }, T };

  function placeLabels(now) {
    const k = cv.clientWidth / CW;
    // Keep bubbles narrower than the gap between neighbouring desks so they never overlap.
    const bubMax = Math.max(80, Math.floor(3.3 * T * k - 6)) + 'px';
    const talkMax = Math.max(110, Math.floor(5.2 * T * k)) + 'px';   // a sentence may wrap to two lines
    // In kiosk mode names and bubbles grow with the screen (11px at the default ~3x scale).
    // On a small office (a phone) they shrink with it, down to 8 px.
    labelsEl.style.fontSize = (KIOSK ? Math.max(11, Math.round(11 * k / 3)) : Math.max(8, Math.min(11, Math.round(11 * k / 2.6)))) + 'px';
    const all = [];
    for (const s of sprites.values()) {
      s.el.style.left = (s.x * k) + 'px';
      s.el.style.top = ((s.y - 20) * k) + 'px';
      const b = s.el.querySelector('.bub');
      const [text, cls] = labelFor(s, now);
      b.style.maxWidth = cls === 'talk' ? talkMax : bubMax;
      if (text) { b.textContent = text; b.className = 'bub ' + cls; b.style.display = ''; }
      else b.style.display = 'none';
      s.el.style.visibility = '';
      // who keeps its label when two would overlap: the one you picked, then who needs you, errors,
      // conversations, work; idle names give way first
      const rank = s.id === cam.sel ? 0 : cls === 'wait' || s.status === 'waiting' ? 1 : cls === 'err' || s.status === 'error' ? 2 : cls === 'talk' ? 3 : text ? 4 : 5;
      all.push({ s, b, text, rank, x: s.x * k, y: (s.y - 20) * k });
    }
    if (all.length < 2) return;
    // Measure once (one layout), then hide what would overlap: first the bubble, then the name.
    for (const o of all) { o.w = o.s.el.offsetWidth; o.h = o.s.el.offsetHeight; const n = o.s.el.lastElementChild; o.nw = n.offsetWidth; o.nh = n.offsetHeight; }
    all.sort((a, b) => a.rank - b.rank || a.y - b.y);
    const placed = [];
    const hits = (r) => placed.some((p) => r.l < p.r && r.r > p.l && r.t < p.b && r.b > p.t);
    for (const o of all) {
      const full = { l: o.x - o.w / 2, r: o.x + o.w / 2, t: o.y - o.h, b: o.y };
      if (!hits(full)) { placed.push(full); continue; }
      const name = { l: o.x - o.nw / 2, r: o.x + o.nw / 2, t: o.y - o.nh, b: o.y };
      if (o.text && o.rank > 1) o.b.style.display = 'none';
      if (o.rank <= 1 || !hits(name)) placed.push(o.rank <= 1 ? full : name);
      else o.s.el.style.visibility = 'hidden';
    }
  }

  let last = performance.now() / 1000;
  const reducedMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Frame rate: 60 by default; HD themes on a kiosk (often a TV box) and reduced-motion users get
  // fewer frames, and the ⚙ menu can lower it further. Hidden tabs draw nothing at all.
  function targetFps() {
    const f = Number(settings.fps);
    if (f) return f;
    if (reducedMotion) return 15;
    return KIOSK && theme.scale > 1 ? 30 : 60;
  }
  function frame() {
    const now = performance.now() / 1000;
    if (!animOn() && !recording) { setTimeout(() => requestAnimationFrame(frame), 400); return; }
    if (!recording && now - last < 1 / targetFps() - 0.004) { requestAnimationFrame(frame); return; }
    const dt = Math.min(0.1, now - last); last = now;
    g.setTransform(theme.scale, 0, 0, theme.scale, 0, 0);
    g.imageSmoothingEnabled = !!theme.smooth;
    g.clearRect(0, 0, CW, CH);
    const hr = new Date().getHours();
    const c = { g, t: now, T, CW, CH, night: hr < 7 || hr >= 20, opts: themeOpts, sprites, desks: DESKS, lounge: LOUNGE, company: officeName, lang, logo: imageOf(looks.logo),
      anyError: [...sprites.values()].some((s) => s.status === 'error') };
    theme.drawRoom(c);
    if (looks.logo) drawLogo(c);
    const list = [];
    theme.props(c, list);
    const byDesk = new Map();
    const hum = humanOn();
    const line = hum ? [...sprites.values()].filter((s) => s.status === 'waiting').sort((a, b) => (a.waitSince || 0) - (b.waitSince || 0)) : [];
    for (const s of sprites.values()) s.queueIdx = -1;
    line.forEach((s, i) => { if (i < queueSpots().length) s.queueIdx = i; });
    for (const s of sprites.values()) {
      step(s, dt, now); byDesk.set(s.desk, s);
      if (s.queueIdx >= 0 && !s.walking) s.dir = -1;         // looking towards the desk
    }
    if (!hum) hideHuman();
    if (hum) { placeHuman(line.length); byDesk.set(DESKS[0], human); list.push({ z: human.y, f: () => theme.drawChar(c, human) }); }
    const deskCount = Math.max(4, Math.min(DESKS.length, Math.ceil((sprites.size + (hum ? 1 : 0)) / 4) * 4));
    DESKS.slice(0, deskCount).forEach((d) => list.push({ z: d[1] * T + 21, f: () => theme.drawDesk(c, d, byDesk.get(d)) }));
    for (const s of sprites.values()) list.push({ z: s.y, f: () => theme.drawChar(c, s) });
    const picked = cam.sel && sprites.get(cam.sel);
    if (picked) list.push({ z: picked.y - 0.01, f: () => {
      g.save(); g.strokeStyle = 'rgba(255,226,138,.9)'; g.lineWidth = 0.9;
      g.beginPath(); g.ellipse(picked.x, picked.y, 7, 2.4, 0, 0, Math.PI * 2); g.stroke(); g.restore();
    } });
    list.sort((a, b) => a.z - b.z).forEach((o) => o.f());
    if (envelopes.length) drawEnvelopes(now);
    if (theme.overlay) theme.overlay(c);
    if (recording) burnLabels(now);
    placeLabels(now);
    followCam();
    placeDetail();
    requestAnimationFrame(frame);
  }

  // ---------- appearance: per-agent looks, photo heads, company logo ----------
  // Stored by the Cubicle server in ~/.cubicle/appearance.json when there is one (so every
  // screen of the office agrees), otherwise in this browser. Never sent anywhere else.
  const LOOK_KEY = 'cubicle.appearance';
  let looks = { agents: {}, names: {} };
  let looksOnServer = false;
  const images = new Map();                       // data URL -> Image (decoded once)
  function imageOf(src) {
    if (!src) return null;
    let im = images.get(src);
    if (!im) { im = new Image(); im.src = src; images.set(src, im); }
    return im.complete && im.naturalWidth ? im : null;
  }
  const normLooks = (d) => ({ agents: (d && d.agents) || {}, names: (d && d.names) || {}, ...(d && d.logo ? { logo: d.logo } : {}) });
  async function loadLooks() {
    if (!DEMO && !EMBED) {
      try { const r = await fetch('/api/appearance', { cache: 'no-store' }); if (r.ok) { looks = normLooks(await r.json()); looksOnServer = true; return; } } catch (_) {}
    }
    try { looks = normLooks(JSON.parse(localStorage.getItem(LOOK_KEY) || '{}')); } catch (_) {}
  }
  // Returns '' when saved where every screen sees it, or a message to show.
  async function saveLooks() {
    if (looksOnServer) {
      try {
        const r = await fetch('/api/appearance', { method: 'PUT', headers: { 'content-type': 'application/json', 'x-cubicle': '1' }, body: JSON.stringify(looks) });
        if (r.ok) return '';
      } catch (_) {}
      try { localStorage.setItem(LOOK_KEY, JSON.stringify(looks)); } catch (_) {}
      return L.lookDenied;
    }
    try { localStorage.setItem(LOOK_KEY, JSON.stringify(looks)); } catch (_) {}
    return '';
  }
  const lookFor = (s) => looks.agents[s.id] || looks.names[s.realName || s.name] || null;
  function applyLook(s) {
    const lk = lookFor(s) || {};
    s.look = lk;
    s.skin = lk.skin || s.baseSkin; s.hair = lk.hairColor || s.baseHair; s.shirt = lk.color || s.baseShirt;
    s.photoSrc = lk.photo || null;
    s.name = (typeof lk.alias === 'string' && lk.alias.trim().slice(0, 40)) || s.realName || s.name;
  }
  // Themes call this to draw an agent's photo in place of the drawn head. Returns false when
  // the agent has no photo (or it is still loading), so the theme draws its own head.
  function photoHead(gc, s, cx, cy, r) {
    const im = s && s.photoSrc ? imageOf(s.photoSrc) : null;
    if (!im) return false;
    gc.save();
    gc.beginPath(); gc.arc(cx, cy, r, 0, Math.PI * 2); gc.closePath();
    gc.fillStyle = s.skin || '#d9a47a'; gc.fill();
    gc.clip();
    gc.imageSmoothingEnabled = true; gc.imageSmoothingQuality = 'high';
    gc.drawImage(im, cx - r, cy - r, r * 2, r * 2);
    gc.restore();
    gc.save(); gc.strokeStyle = 'rgba(0,0,0,.35)'; gc.lineWidth = Math.max(0.25, r * 0.08);
    gc.beginPath(); gc.arc(cx, cy, r, 0, Math.PI * 2); gc.stroke(); gc.restore();
    return true;
  }
  window.CubicleThemes.photoHead = photoHead;

  // The company logo, drawn where the theme leaves room for it (theme.logoSpot, office pixels).
  function drawLogo(c) {
    const im = imageOf(looks.logo);
    if (!im || c.logoDrawn || theme.logoSpot === false) return;
    const [x, y, w, h] = typeof theme.logoSpot === 'function' ? theme.logoSpot(c) : (theme.logoSpot || [11.7 * T, 5, 18, 18]);
    const k = Math.min(w / im.naturalWidth, h / im.naturalHeight), dw = im.naturalWidth * k, dh = im.naturalHeight * k;
    g.save();
    g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    g.restore();
  }

  // Read an image file into a data URL, scaled down to at most `max` pixels on its longest side.
  function readImage(file) {
    return new Promise((resolve, reject) => {
      if (!file || !/^image\//.test(file.type)) return reject(new Error('not an image'));
      const fr = new FileReader();

  // Photo crop: the picture moves and zooms under a fixed circle; what is inside the circle

  async function startCrop(file) {

      if (!faces.length) { msg.textContent = L.noFace; return; }

  // ---------- alerts: notification and sound when an agent needs you ----------

  function chime(kind) {

      audio = audio || new (window.AudioContext || window.webkitAudioContext)();

  function startRecording(button) {
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const type = window.MediaRecorder && types.find((t) => MediaRecorder.isTypeSupported(t));
    if (!type || !cv.captureStream) { button.textContent = L.recordUnsupported; return; }
    const chunks = [], secs = 30;
    const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 6e6 });
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };

  // ---------- settings ----------

  // plus one entry there; see docs/THEMES.md.
  let CATALOG = [{ id: 'pixel', name: themes.pixel.name, options: [] }];
  const tr = (o) => (o && (o[lang] || o.en)) || '';
  const LANG_NAMES = { en: 'English', tr: 'Türkçe', de: 'Deutsch', es: 'Español', fr: 'Français', zh: '中文', ar: 'العربية' };
  const STORE = 'cubicle.settings';
  let settings = { theme: 'pixel' };
  try { settings = { ...settings, ...JSON.parse(localStorage.getItem(STORE) || '{}') }; } catch (_) {}
  // URL parameters win, so a kiosk link always opens the same way.
  if (params.get('theme')) settings.theme = params.get('theme');
  if (['auto', '30', '15', '60'].includes(params.get('fps'))) settings.fps = params.get('fps');

  if (['0', '1'].includes(params.get('human'))) settings.human = params.get('human') === '1';
  async function loadCatalog() {

  function renderSettings() {
    const entry = CATALOG.find((c) => c.id === theme.id) || CATALOG[0];
    // Compact: label and control on one line, three short groups, notes as tooltips.
    const sel = (key, label, values, cur) => `<div class="srow"><label for="set-${key}">${esc(label)}</label><select id="set-${key}" data-key="${key}">` +
      values.map(([v, n]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(tr(n))}</option>`).join('') + '</select></div>';
    const own = (key, label, values, cur) => sel(key, label, values.map(([v, n]) => [v, { en: n }]), cur).replace('<select ', '<select data-own="1" ');
    const check = (id, on, label, title, disabled) => `<label class="check" title="${esc(title || '')}"><input type="checkbox" id="${id}"${on ? ' checked' : ''}${disabled ? ' disabled' : ''}> ${esc(label)}</label>`;
    const btn = (id, label, title) => `<button type="button" id="${id}" title="${esc(title || label)}">${esc(label)}</button>`;
    panel.innerHTML = `<div class="shead">${esc(L.sView)}</div>` +
      sel('theme', L.theme, CATALOG.map((c) => [c.id, c.name]), entry.id) +
      entry.options.map((o) => sel(o.key, tr(o.label), o.values, themeOpts[o.key])).join('') +
      (animOn() ? own('layout', L.layout, [['auto', L.layoutAuto], ['height', L.layoutHeight], ['side', L.layoutSide], ['stack', L.layoutStack]], settings.layout || 'auto') : '') +
      own('lang', L.language, [['', L.languageAuto], ...Object.keys(STR).map((k) => [k, LANG_NAMES[k] || k])], settings.lang || '') +
      own('fps', L.fps, [['auto', L.fpsAuto], ['30', L.fps30], ['15', L.fps15]], settings.fps || 'auto') +
      `<div class="checks">${check('set-anim', animOn(), L.anim, L.viewNote, !cardsOn())}${check('set-cards', cardsOn(), L.cardsToggle, L.viewNote, !animOn())}` +
      (animOn() ? check('set-human', humanOn(), L.sHuman, L.human) + (humanOn() ? `<button type="button" id="set-mylook" class="mini" title="${esc(L.myLook)}">✎ ${esc(L.myLook)}</button>` : '') : '') + '</div>' +
      `<div class="shead">${esc(L.sAlerts)}</div>` +
      `<div class="checks">${check('set-notify', settings.notify, L.sNotify, L.notify)}</div>` +
      own('sound', L.sound, [['off', L.soundOff], ['need', L.soundNeed], ['all', L.soundAll]], settings.sound || 'off') +
      `<div class="shead">${esc(L.sMore)}</div><div class="sbtns">` +
      btn('set-tg', L.tgButton) + btn('set-copy', '🔗 ' + L.sCopy, L.settingsNote) +
      btn('set-logo', '🖼 ' + L.sLogo, L.logoPick) + (looks.logo ? btn('set-nologo', '✕ ' + L.sNoLogo, L.logoRemove) : '') +
      btn('set-export', '⤓ ' + L.sExport, L.exportLooks) + btn('set-import', '⤒ ' + L.sImport, L.importLooks) +
      (animOn() ? btn('set-record', recording ? L.recording(Math.ceil(recording.until - performance.now() / 1000)) : '⏺ ' + L.sRecord, L.record) : '') + '</div>';
    panel.querySelectorAll('select').forEach((el) => el.addEventListener('change', () => {
      settings[el.dataset.key] = el.value; save();
      if (el.dataset.key === 'lang') { if (!el.value) delete settings.lang; save(); location.reload(); return; }
      if (el.dataset.key === 'layout') { fitLayout(); clampCam(); return; }
      if (el.dataset.own) { if (el.dataset.key === 'sound' && el.value !== 'off') chime('need'); return; }
      applySettings();
    }));
    panel.querySelector('#set-notify').addEventListener('change', async (e) => {
      settings.notify = e.target.checked; save();
      if (settings.notify && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
      if (settings.notify && (!('Notification' in window) || Notification.permission === 'denied')) {
        e.target.checked = settings.notify = false; save();
        e.target.parentElement.insertAdjacentHTML('afterend', `<div class="note">${esc(L.notifyBlocked)}</div>`);
      }
    });
    panel.querySelector('#set-logo').addEventListener('click', async () => {
      const f = await pickFile(); if (!f) return;
      try { looks.logo = toDataUrl(await readImage(f), 256); await saveLooks(); renderSettings(); } catch (_) {}
    });
    const nologo = panel.querySelector('#set-nologo');
    if (nologo) nologo.addEventListener('click', async () => { delete looks.logo; await saveLooks(); renderSettings(); });
    panel.querySelector('#set-export').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(looks, null, 1)], { type: 'application/json' }));
      a.download = 'cubicle-appearance.json'; document.body.appendChild(a); a.click(); a.remove();
    });
    panel.querySelector('#set-import').addEventListener('click', async () => {
      const f = await pickFile('application/json,.json'); if (!f) return;
      try {
        const d = normLooks(JSON.parse(await f.text()));
        looks = { agents: { ...looks.agents, ...d.agents }, names: { ...looks.names, ...d.names }, ...(d.logo || looks.logo ? { logo: d.logo || looks.logo } : {}) };
        await saveLooks(); for (const sp of sprites.values()) applyLook(sp); renderCards(); renderSettings();
      } catch (_) {}
    });
    const rec = panel.querySelector('#set-record');
    if (rec) rec.addEventListener('click', (e) => { if (!recording) startRecording(e.target); });
    panel.querySelector('#set-tg').addEventListener('click', () => { panel.hidden = true; openTelegram(); });
    const hb = panel.querySelector('#set-human');
    if (hb) hb.addEventListener('change', (e) => { settings.human = e.target.checked; save(); if (!settings.human) hideHuman(); renderSettings(); poll(); });
    const ml = panel.querySelector('#set-mylook');
    if (ml) ml.addEventListener('click', () => { panel.hidden = true; openLooks(human); });
    for (const key of ['anim', 'cards']) panel.querySelector(`#set-${key}`).addEventListener('change', (e) => {
      settings[key] = e.target.checked; save(); applyView(); renderSettings();
    });
    panel.querySelector('#set-copy').addEventListener('click', async (e) => {
      const u = new URL(location.href);
      u.searchParams.set('theme', entry.id);
      for (const o of entry.options) u.searchParams.set(o.key, themeOpts[o.key]);
      if (settings.lang) u.searchParams.set('lang', settings.lang);
      try { await navigator.clipboard.writeText(u.toString()); e.target.textContent = L.copied; }
      catch (_) { prompt(L.copyLink, u.toString()); }
      setTimeout(() => { e.target.textContent = '🔗 ' + L.sCopy; }, 1500);
    });
  }

  if (params.has('debug')) window.CubicleDebug = { sprites, findPath, walkGrid, cam, select, openAnswer, renderCards, startChat };   // for tests and theme authors
  resizeCanvas();
  loadCatalog().then(applySettings).then(applyView);
  init();
})();
</script>
</body>
</html>
