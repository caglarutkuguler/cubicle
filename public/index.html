<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubicle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23222536'/%3E%3Crect x='3' y='3' width='10' height='6' fill='%235cc8f0'/%3E%3Crect x='2' y='11' width='12' height='2' fill='%238b5a2b'/%3E%3C/svg%3E">
<style>
  :root { --bg:#171926; --panel:#222536; --line:#33374d; --text:#e9e7f2; --muted:#9a9bb3; --link:#9ec5ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:14px 16px 28px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  h1 { font-size:17px; margin:0; letter-spacing:.2px; }
  h1 small { color:var(--muted); font-weight:500; margin-left:8px; }
  .right { display:flex; align-items:center; gap:10px; color:var(--muted); }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit; }
  #stage { position:relative; width:100%; aspect-ratio:352/208; border:2px solid var(--line); border-radius:8px; overflow:hidden; background:#2a2d3d; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #labels { position:absolute; inset:0; pointer-events:none; font-size:11px; }
  .lbl { position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; white-space:nowrap; }
  .bub { background:#fff; color:#1d1f2b; border-radius:.82em; padding:.18em .64em; font-size:1em; font-weight:600; margin-bottom:.27em; box-shadow:0 1px 0 rgba(0,0,0,.3); max-width:210px; overflow:hidden; text-overflow:ellipsis; }
  .bub.err { background:#ffdede; color:#8a1111; }
  .bub.ok { background:#dcffe2; color:#145c24; }
  .bub.wait { background:#fff1c9; color:#6b4d00; }
  .name { background:rgba(15,16,26,.78); color:#fff; font-size:1em; font-weight:600; padding:.09em .55em; border-radius:.45em; }
  /* ?kiosk: the office fills the screen, for a TV or a second monitor */
  body.kiosk { overflow:hidden; cursor:none; }
  body.kiosk .wrap { max-width:none; padding:0; height:100vh; display:flex; align-items:center; justify-content:center; }
  body.kiosk header { position:fixed; top:0; left:0; right:0; z-index:2; margin:0; padding:1vh 1.4vw; background:linear-gradient(rgba(10,11,18,.8), rgba(10,11,18,0)); }
  body.kiosk h1 { font-size:clamp(16px, 1.5vw, 34px); }
  body.kiosk h1 small, body.kiosk #status { font-size:clamp(12px, 1.05vw, 24px); }
  body.kiosk #stage { width:min(100vw, calc(100vh * var(--ar, 1.6923))); border:0; border-radius:0; }
  body.kiosk #cards, body.kiosk footer, body.kiosk #banner, body.kiosk #company { display:none !important; }
  #banner { display:none; margin-bottom:10px; padding:8px 12px; border-radius:8px; background:#2b2f47; border:1px solid var(--line); color:var(--muted); }
  #cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; margin-top:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
  .card .top { display:flex; align-items:center; gap:8px; }
  .sw { width:12px; height:12px; border-radius:3px; flex:none; }
  .card b { font-size:13px; }
  .card .role { color:var(--muted); font-size:12px; }
  .card .st { margin-top:4px; font-size:12px; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .pill { display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; margin-right:6px; }
  .p-running { background:#1f5130; color:#9ff0b4; }
  .p-idle { background:#33374d; color:#c9cbe0; }
  .p-error { background:#5a1f25; color:#ffb3b8; }
  .p-paused { background:#4d4221; color:#f3dc92; }
  .p-waiting { background:#5a4a12; color:#ffe08a; }
  #gear { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; font-size:15px; line-height:1; padding:3px 7px; cursor:pointer; }
  #gear:hover, #gear[aria-expanded="true"] { color:var(--text); border-color:#4a4f6b; }
  #settings { position:absolute; right:0; top:calc(100% + 6px); z-index:5; width:260px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.35); color:var(--text); }
  #settings label { display:block; font-size:12px; color:var(--muted); margin:0 0 4px; }
  #settings select { width:100%; margin-bottom:10px; }
  #settings button { width:100%; background:#2f3552; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; cursor:pointer; }
  #settings .note { font-size:11px; color:var(--muted); margin-top:8px; }
  .right { position:relative; }
  body.kiosk #gear, body.kiosk #settings { display:none !important; }
  footer { color:var(--muted); font-size:12px; margin-top:12px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cubicle <small id="co"></small></h1>
    <div class="right">
      <select id="company" hidden></select>
      <span id="status"></span>
      <button id="gear" type="button" aria-expanded="false" aria-controls="settings">⚙</button>
      <div id="settings" hidden></div>
    </div>
  </header>
  <div id="banner"></div>
  <div id="stage">
    <canvas id="c" width="352" height="208"></canvas>
    <div id="labels"></div>
  </div>
  <div id="cards"></div>
  <footer>
    <span id="hint"></span>
    <span><a href="https://github.com/caglarutkuguler/cubicle" target="_blank" rel="noopener">Cubicle</a> · MIT</span>
  </footer>
</div>

<script>
(() => {
  // ---------- i18n ----------
  const STR = {
    en: {
      connecting: 'Connecting…', unreachable: "Can't reach Paperclip, retrying…",
      denied: (c) => `Paperclip refused access (${c}). Set PAPERCLIP_TOKEN for an authenticated Paperclip, or check the key.`, feedUnreachable: "Can't read the agent feed, retrying…",
      empty: 'No agents yet.', emptyClaude: 'No Claude Code sessions yet — start <code>claude</code> in any folder and it will walk in.',
      noCompany: 'No company yet.', summary: (n, r) => `${n} agents · ${r} working`,
      running: 'working', idle: 'idle', error: 'error', paused: 'paused', waiting: 'needs you', noTask: 'no open task assigned',
      done: '✓ done', errBubble: '⚠ error', waitBubble: '✋ needs you',
      asks: 'waiting for your answer on', needYou: (n) => `${n} need${n === 1 ? 's' : ''} you`, redacted: '🔒 details hidden',
      settings: 'Settings', theme: 'Theme', copyLink: 'Copy link with these settings', copied: 'Copied ✓',
      settingsNote: 'Saved in this browser. The link carries them to another screen (add ?kiosk for a TV).',
      spend: (a, b) => `${a} / ${b} this month`, spendNoBudget: (a) => `${a} this month`, spendTitle: 'Spend this month, as reported by Paperclip',
      handoff: (id, to) => `${id} → ${to}`, replay: 'replay',
      chatter: ['☕', 'coffee break', '…', 'hmm', "what's next?"],
      hint: 'Working agents sit at their desks and type; idle agents hang out in the lounge. Refreshes every 4 s.',
      demo: 'Demo mode — fake agents. Remove <code>?demo</code> from the URL to watch your own Paperclip company.',
      hosted: 'This is the hosted demo with fake agents. To watch your own agents, run <code>npx @caglarutkuguler/cubicle</code> and open <code>http://127.0.0.1:3200</code>, or install it as a Paperclip plugin.',
    },
    tr: {
      connecting: 'Bağlanılıyor…', unreachable: "Paperclip'e ulaşılamıyor, yeniden deneniyor…",
      denied: (c) => `Paperclip erişimi reddetti (${c}). Kimlik doğrulamalı Paperclip için PAPERCLIP_TOKEN tanımlayın veya anahtarı kontrol edin.`, feedUnreachable: 'Ajan verisi okunamıyor, yeniden deneniyor…',
      empty: 'Henüz ajan yok.', emptyClaude: 'Henüz Claude Code oturumu yok. Herhangi bir klasörde <code>claude</code> başlatın, ofise girecek.',
      noCompany: 'Henüz şirket yok.', summary: (n, r) => `${n} ajan · ${r} çalışıyor`,
      running: 'çalışıyor', idle: 'boşta', error: 'hata', paused: 'duraklatıldı', waiting: 'sizi bekliyor', noTask: 'atanmış açık görev yok',
      done: '✓ bitirdi', errBubble: '⚠ hata', waitBubble: '✋ sizi bekliyor',
      asks: 'cevabınızı bekliyor:', needYou: (n) => `${n} sizi bekliyor`, redacted: '🔒 ayrıntılar gizli',
      settings: 'Ayarlar', theme: 'Tema', copyLink: 'Bu ayarlarla link kopyala', copied: 'Kopyalandı ✓',
      settingsNote: 'Bu tarayıcıda saklanır. Link, ayarları başka bir ekrana taşır (TV için ?kiosk ekleyin).',
      spend: (a, b) => `bu ay ${a} / ${b}`, spendNoBudget: (a) => `bu ay ${a}`, spendTitle: 'Paperclip’in bildirdiği bu ayki harcama',
      handoff: (id, to) => `${id} → ${to}`, replay: 'tekrar',
      chatter: ['☕', 'kahve molası', '…', 'hmm', 'sıradaki iş?'],
      hint: 'Çalışan ajan masasına oturup yazar; boştaki ajan dinlenme alanında dolaşır. 4 saniyede bir yenilenir.',
      demo: "Demo modu: sahte ajanlar. Kendi Paperclip şirketinizi izlemek için adresten <code>?demo</code> kısmını kaldırın.",
      hosted: "Bu, sahte ajanlarla çalışan barındırılan demo. Kendi ajanlarınızı izlemek için <code>npx @caglarutkuguler/cubicle</code> çalıştırıp <code>http://127.0.0.1:3200</code> adresini açın ya da Paperclip eklentisi olarak kurun.",
    },
    de: {
      connecting: 'Verbinde…', unreachable: 'Paperclip nicht erreichbar, neuer Versuch…',
      denied: (c) => `Paperclip hat den Zugriff verweigert (${c}). Für ein Paperclip mit Anmeldung PAPERCLIP_TOKEN setzen oder den Schlüssel prüfen.`, feedUnreachable: 'Agenten-Feed nicht lesbar, neuer Versuch…',
      empty: 'Noch keine Agenten.', emptyClaude: 'Noch keine Claude-Code-Sitzungen. Starte <code>claude</code> in einem beliebigen Ordner, dann kommt sie herein.',
      noCompany: 'Noch keine Firma.', summary: (n, r) => `${n} Agenten · ${r} arbeiten`,
      running: 'arbeitet', idle: 'frei', error: 'Fehler', paused: 'pausiert', waiting: 'braucht dich', noTask: 'keine offene Aufgabe zugewiesen',
      done: '✓ fertig', errBubble: '⚠ Fehler', waitBubble: '✋ braucht dich',
      asks: 'wartet auf deine Antwort zu', needYou: (n) => `${n} ${n === 1 ? 'braucht' : 'brauchen'} dich`, redacted: '🔒 Details verborgen',
      settings: 'Einstellungen', theme: 'Thema', copyLink: 'Link mit diesen Einstellungen kopieren', copied: 'Kopiert ✓',
      settingsNote: 'In diesem Browser gespeichert. Der Link nimmt sie auf einen anderen Bildschirm mit (für einen Fernseher ?kiosk anhängen).',
      spend: (a, b) => `${a} / ${b} diesen Monat`, spendNoBudget: (a) => `${a} diesen Monat`, spendTitle: 'Ausgaben diesen Monat, laut Paperclip',
      handoff: (id, to) => `${id} → ${to}`, replay: 'Wiedergabe',
      chatter: ['☕', 'Kaffeepause', '…', 'hmm', 'was kommt jetzt?'],
      hint: 'Arbeitende Agenten sitzen am Schreibtisch und tippen, freie hängen in der Lounge ab. Aktualisiert alle 4 s.',
      demo: 'Demo-Modus mit erfundenen Agenten. Entferne <code>?demo</code> aus der Adresse, um deine eigene Paperclip-Firma zu sehen.',
      hosted: 'Das ist die gehostete Demo mit erfundenen Agenten. Für deine eigenen Agenten <code>npx @caglarutkuguler/cubicle</code> ausführen und <code>http://127.0.0.1:3200</code> öffnen, oder es als Paperclip-Plugin installieren.',
    },
    es: {
      connecting: 'Conectando…', unreachable: 'No se puede conectar con Paperclip, reintentando…',
      denied: (c) => `Paperclip denegó el acceso (${c}). Define PAPERCLIP_TOKEN para un Paperclip con autenticación o revisa la clave.`, feedUnreachable: 'No se puede leer el feed de agentes, reintentando…',
      empty: 'Todavía no hay agentes.', emptyClaude: 'Todavía no hay sesiones de Claude Code. Ejecuta <code>claude</code> en cualquier carpeta y entrará.',
      noCompany: 'Todavía no hay empresa.', summary: (n, r) => `${n} agentes · ${r} trabajando`,
      running: 'trabajando', idle: 'libre', error: 'error', paused: 'en pausa', waiting: 'te necesita', noTask: 'sin tarea abierta asignada',
      done: '✓ listo', errBubble: '⚠ error', waitBubble: '✋ te necesita',
      asks: 'espera tu respuesta en', needYou: (n) => `${n} te ${n === 1 ? 'necesita' : 'necesitan'}`, redacted: '🔒 detalles ocultos',
      settings: 'Ajustes', theme: 'Tema', copyLink: 'Copiar enlace con estos ajustes', copied: 'Copiado ✓',
      settingsNote: 'Se guardan en este navegador. El enlace los lleva a otra pantalla (añade ?kiosk para una TV).',
      spend: (a, b) => `${a} / ${b} este mes`, spendNoBudget: (a) => `${a} este mes`, spendTitle: 'Gasto de este mes según Paperclip',
      handoff: (id, to) => `${id} → ${to}`, replay: 'repetición',
      chatter: ['☕', 'pausa para el café', '…', 'mmm', '¿y ahora qué?'],
      hint: 'Los agentes que trabajan se sientan en su mesa y teclean; los libres pasan el rato en la sala de descanso. Se actualiza cada 4 s.',
      demo: 'Modo demo con agentes ficticios. Quita <code>?demo</code> de la dirección para ver tu propia empresa de Paperclip.',
      hosted: 'Esta es la demo alojada con agentes ficticios. Para ver tus propios agentes, ejecuta <code>npx @caglarutkuguler/cubicle</code> y abre <code>http://127.0.0.1:3200</code>, o instálalo como plugin de Paperclip.',
    },
    fr: {
      connecting: 'Connexion…', unreachable: 'Impossible de joindre Paperclip, nouvel essai…',
      denied: (c) => `Paperclip a refusé l’accès (${c}). Définissez PAPERCLIP_TOKEN pour un Paperclip avec authentification, ou vérifiez la clé.`, feedUnreachable: 'Impossible de lire le flux des agents, nouvel essai…',
      empty: 'Aucun agent pour l’instant.', emptyClaude: 'Aucune session Claude Code pour l’instant. Lancez <code>claude</code> dans n’importe quel dossier et elle entrera.',
      noCompany: 'Aucune entreprise pour l’instant.', summary: (n, r) => `${n} agents · ${r} au travail`,
      running: 'au travail', idle: 'libre', error: 'erreur', paused: 'en pause', waiting: 'a besoin de vous', noTask: 'aucune tâche ouverte assignée',
      done: '✓ terminé', errBubble: '⚠ erreur', waitBubble: '✋ a besoin de vous',
      asks: 'attend votre réponse sur', needYou: (n) => `${n} ${n === 1 ? 'a' : 'ont'} besoin de vous`, redacted: '🔒 détails masqués',
      settings: 'Réglages', theme: 'Thème', copyLink: 'Copier le lien avec ces réglages', copied: 'Copié ✓',
      settingsNote: 'Enregistrés dans ce navigateur. Le lien les emporte sur un autre écran (ajoutez ?kiosk pour une télé).',
      spend: (a, b) => `${a} / ${b} ce mois-ci`, spendNoBudget: (a) => `${a} ce mois-ci`, spendTitle: 'Dépenses du mois, selon Paperclip',
      handoff: (id, to) => `${id} → ${to}`, replay: 'relecture',
      chatter: ['☕', 'pause café', '…', 'hum', 'et maintenant ?'],
      hint: 'Les agents au travail sont assis à leur bureau et tapent ; les agents libres traînent dans le salon. Actualisé toutes les 4 s.',
      demo: 'Mode démo avec des agents fictifs. Retirez <code>?demo</code> de l’adresse pour voir votre propre entreprise Paperclip.',
      hosted: 'Ceci est la démo en ligne avec des agents fictifs. Pour voir vos propres agents, lancez <code>npx @caglarutkuguler/cubicle</code> et ouvrez <code>http://127.0.0.1:3200</code>, ou installez-le comme plugin Paperclip.',
    },
  };
  const params = new URLSearchParams(location.search);
  // Any language with a block in STR is picked from ?lang=xx or the browser language; English otherwise.
  const wantLang = (params.get('lang') || navigator.language || 'en').slice(0, 2).toLowerCase();
  const lang = STR[wantLang] ? wantLang : 'en';
  const L = STR[lang];
  document.documentElement.lang = lang;
  // Becomes true in init() as well when the page is served without the Cubicle
  // proxy behind it (e.g. the hosted demo on GitHub Pages).
  let DEMO = params.has('demo');
  const KIOSK = params.has('kiosk');
  // Inside Paperclip (installed as a plugin) the page is served by Paperclip itself and
  // reads its API directly on the same origin, with the signed-in user's own access.
  const EMBED = params.get('embed') === 'paperclip';
  if (KIOSK) document.body.classList.add('kiosk');

  // ---------- setup ----------
  const T = 16, CW = 352;
  let CH = 208;                        // grows with the number of desk rows
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  const stageEl = document.getElementById('stage');
  const labelsEl = document.getElementById('labels');
  const cardsEl = document.getElementById('cards');
  const statusEl = document.getElementById('status');
  const companySel = document.getElementById('company');
  document.getElementById('hint').textContent = L.hint;
  statusEl.textContent = L.connecting;

  // Office layout, in tiles. Three rows of four desks by default; whenever there are more
  // agents than desks the office grows by another row (and more lounge spots), so nobody
  // ever has to share a desk.
  const BASE_DESKS = [[1,3],[4.5,3],[8,3],[11.5,3],[1,7.5],[4.5,7.5],[8,7.5],[11.5,7.5],[1,10.5],[4.5,10.5],[8,10.5],[11.5,10.5]];
  const BASE_LOUNGE = [[16,4.4],[18,4.4],[20,4.4],[16.2,10],[18.3,10.6],[20.3,10],[15.8,7.4],[21,7.4],[17,12],[19.5,12],[16.4,5.6],[19.6,5.6]];
  let DESKS = BASE_DESKS, LOUNGE = BASE_LOUNGE, ROWS = 3;
  function layoutFor(n) {
    const rows = Math.max(3, Math.ceil(n / 4));
    if (rows === ROWS) return;
    ROWS = rows;
    DESKS = BASE_DESKS.slice(); LOUNGE = BASE_LOUNGE.slice();
    for (let r = 1; r <= rows - 3; r++) {
      const y = 10.5 + 3.5 * r;
      DESKS.push([1, y], [4.5, y], [8, y], [11.5, y]);
      LOUNGE.push([16, y + 1], [17.8, y + 2], [19.6, y + 1], [21, y + 2]);
    }
    CH = (13 + (rows - 3) * 3.5) * T;
    resizeCanvas();
  }
  function resizeCanvas() {
    const k = theme ? theme.scale : 1;
    cv.width = CW * k; cv.height = CH * k;
    cv.style.imageRendering = theme && theme.smooth ? 'auto' : 'pixelated';
    stageEl.style.aspectRatio = `${CW} / ${CH}`;
    stageEl.style.setProperty('--ar', String(CW / CH));
  }
  const SHIRTS = ['#e05d5d','#4f9dde','#57b86b','#e0a33b','#a66de0','#3bc4c4','#e07ab8','#9aa0b4','#f07b3f','#6fcf97','#c9b458','#5f7ee0'];
  const HAIRS  = ['#2b1d14','#111111','#6b3e1f','#c9a04a','#8b4513','#3b2a20','#d9d0c1','#4a2b1a'];
  const SKINS  = ['#f1c7a3','#d9a47a','#b87b52','#f5d5b8','#c68e62'];

  let paperclipUrl = '';
  let companies = [];
  let company = null;
  const sprites = new Map();

  const hash = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- data sources ----------
  async function getJSON(u) { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }

  // Each provider loads { agents, issues, label } from one source. Several providers can
  // share one office (--source paperclip,claude-code); feed agent ids are namespaced so they
  // never collide with Paperclip ids.
  function paperclipProvider() {
    const p = {
      kind: 'paperclip', label: 'Paperclip',
      async load() {
        if (!company) {
          companies = await getJSON('/api/companies');
          if (!companies.length) return { agents: [], issues: [], label: '', note: L.noCompany };
          const want = params.get('company');
          company = companies.find((c) => c.issuePrefix === want || c.id === want) || companies[0];
          if (companies.length > 1 && !EMBED) {
            companySel.hidden = false;
            companySel.innerHTML = companies.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
            companySel.value = company.id;
          }
        }
        const [agents, issues] = await Promise.all([
          getJSON(`/api/companies/${company.id}/agents`),
          // Open issues only; the Cubicle server filters these itself, Paperclip can do it for us.
          getJSON(`/api/companies/${company.id}/issues${EMBED ? '?status=backlog,todo,in_progress,in_review,blocked' : ''}`),
        ]);
        p.label = company.name;
        return { agents, issues, label: company.name };
      },
    };
    return p;
  }

  // Generic feed (docs/FEED.md): { company?, agents: [{ id, name, role?, status, task?, error? }] } or a bare array.
  const STATUS_ALIASES = {
    running: 'running', working: 'running', busy: 'running', active: 'running',
    idle: 'idle', done: 'idle', finished: 'idle', ready: 'idle',
    error: 'error', failed: 'error', crashed: 'error',
    paused: 'paused', sleeping: 'paused', stopped: 'paused', offline: 'paused',
    waiting: 'waiting', blocked: 'waiting', needs_input: 'waiting', permission: 'waiting',
  };
  function feedProvider(path, label) {
    const p = {
      kind: 'feed', label, claude: label === 'Claude Code',
      async load() {
        const raw = await getJSON(path);
        const list = Array.isArray(raw) ? raw : Array.isArray(raw?.agents) ? raw.agents : [];
        if (raw && raw.company) p.label = String(raw.company);
        const agents = list.map((a, i) => {
          const t = a.task;
          const task = !t ? null : typeof t === 'string'
            ? { identifier: '', title: t, url: a.taskUrl || '' }
            : { identifier: String(t.id ?? t.identifier ?? ''), title: t.title ?? '', url: t.url || '' };
          return {
            id: `${path}#${a.id ?? a.name ?? i}`, name: String(a.name ?? a.id ?? `agent ${i + 1}`),
            title: a.role || a.title || '', createdAt: String(a.since ?? a.createdAt ?? i).padStart(20, '0'),
            status: STATUS_ALIASES[String(a.status || 'idle').toLowerCase()] || 'idle',
            errorReason: a.error || null, task,
          };
        });
        return { agents, issues: [], label: p.label };
      },
    };
    return p;
  }

  function demoProvider() {
    const t0 = Date.now();
    const roster = [
      ['CEO', 'Chief Executive'], ['WebDev', 'Web Developer'], ['SEO', 'SEO & Content'],
      ['Growth', 'Growth Marketer'], ['Analyst', 'Functional Analyst'], ['QA', 'QA & Refactoring'],
    ];
    const tasks = ['Audit site health', 'Keyword research', 'Qualified leads shortlist', 'Review checkout flow', 'Refactor module', 'Write test checklist'];
    const spend = [[420, 2000], [1250, 2000], [2000, 2000], [1830, 2000], [0, 0], [610, 1000]];   // cents: spent, budget
    const agents = roster.map(([name, title], i) => ({
      id: `demo-${i}`, name, title, createdAt: `2026-01-01T00:0${i}:00Z`, status: 'idle', errorReason: null,
      spentMonthlyCents: spend[i][0], budgetMonthlyCents: spend[i][1],
    }));
    function tick() {
      const s = Math.floor((Date.now() - t0) / 1000);
      agents.forEach((a, i) => {
        const phase = Math.floor((s + i * 7) / (9 + i * 2)) % 5;
        a.status = phase === 4 && i === 2 ? 'error' : phase === 3 && i === 3 ? 'waiting' : phase % 2 === 0 ? 'running' : 'idle';
        a.errorReason = a.status === 'error' ? 'Example error: connection lost' : null;
      });
    }
    return {
      kind: 'demo', label: 'Demo Co.',
      async load() {
        tick();
        if (!company) company = { id: 'demo', name: 'Demo Co.', issuePrefix: 'DEMO' };
        // Every 30 s the Analyst hands its task to QA and back, to show a hand-off.
        const passed = Math.floor((Date.now() - t0) / 30000) % 2 === 1;
        const issues = agents.map((a, i) => ({ identifier: `DEMO-${i + 1}`, title: tasks[i], status: 'in_progress', assigneeAgentId: i === 4 && passed ? agents[5].id : a.id }));
        return { agents: agents.map((a) => ({ ...a })), issues, label: 'Demo Co.' };
      },
    };
  }

  let providers = [];
  let officeName = '';    // first source's company name; themes may put it on the wall
  let redacted = false;   // server runs with --redact: titles/commands never reach the page
  let replayClock = null; // server plays back a recording (--source replay:file): show its clock

  async function init() {
    const b = document.getElementById('banner');
    if (EMBED) {
      paperclipUrl = location.origin;
      providers = [paperclipProvider()];
    } else if (!DEMO) {
      try {
        const cfg = await getJSON('/config.json');
        redacted = !!cfg.redact;
        if (cfg.replay) replayClock = { ...cfg.replay, loadedAt: Date.now() };
        const list = cfg.sources || [cfg.source === 'feed'
          ? { kind: 'feed', label: cfg.label, path: '/api/feed' }
          : { kind: 'paperclip', paperclipUrl: cfg.paperclipUrl }];
        providers = list.map((x) => {
          if (x.kind === 'paperclip') { paperclipUrl = x.paperclipUrl || ''; return paperclipProvider(); }
          return feedProvider(x.path || '/api/feed', x.label || 'feed');
        });
        // Reload when the server was updated or restarted.
        if (cfg.build) setInterval(async () => {
          try { if ((await getJSON('/config.json')).build !== cfg.build) location.reload(); } catch (_) {}
        }, 60000);
      } catch (_) {
        // No Cubicle server behind this page: show the demo instead of an error.
        DEMO = true;
        b.innerHTML = L.hosted; b.style.display = 'block';
      }
    } else {
      b.innerHTML = L.demo; b.style.display = 'block';
    }
    if (DEMO) providers = [demoProvider()];
    poll();
    setInterval(poll, 4000);
    requestAnimationFrame(frame);
  }

  function timeText() {
    if (!replayClock) return new Date().toLocaleTimeString(lang);
    const r = replayClock, span = Math.max(1, r.to - r.from + (r.hold || 0));
    const at = r.from + ((r.at - r.from) + (Date.now() - r.loadedAt) * r.speed) % span;
    return `▶ ${L.replay} ${new Date(at).toLocaleString(lang, { weekday: 'short', hour: '2-digit', minute: '2-digit' })} ×${r.speed}`;
  }

  function failureText(p, e) {
    const code = Number(e && e.message);
    if (p.kind === 'feed') return L.feedUnreachable;
    return (code === 401 || code === 403) ? L.denied(code) : L.unreachable;
  }

  async function poll() {
    const results = await Promise.allSettled(providers.map((p) => p.load()));
    const agents = [], issues = [], labels = [], failed = [], notes = [];
    results.forEach((r, i) => {
      if (r.status === 'rejected') { failed.push(i); return; }
      r.value.agents.forEach((a) => { a._src = i; });
      agents.push(...r.value.agents);
      issues.push(...r.value.issues);
      if (r.value.label) labels.push(r.value.label);
      if (r.value.note) notes.push(r.value.note);
    });
    if (failed.length === providers.length) {
      statusEl.textContent = failureText(providers[0], results[0].reason);
      return;
    }
    document.getElementById('co').textContent = labels.join(' · ');
    officeName = labels[0] || '';
    sync(agents, issues);
    if (!DEMO) {
      const b = document.getElementById('banner');
      if (!agents.length && providers.some((p) => p.kind === 'feed')) {
        b.innerHTML = providers.some((p) => p.claude) ? L.emptyClaude : L.empty; b.style.display = 'block';
      } else b.style.display = 'none';
    }
    const running = agents.filter((a) => a.status === 'running').length;
    const needYou = [...sprites.values()].filter((x) => x.status === 'waiting' || x.ask).length;
    const down = failed.map((i) => `⚠ ${providers[i].label}: ${failureText(providers[i], results[i].reason)}`);
    statusEl.textContent = [
      notes.length && !agents.length ? notes.join(' ') : L.summary(agents.length, running),
      needYou ? L.needYou(needYou) : '', ...down, redacted ? L.redacted : '', timeText(),
    ].filter(Boolean).join(' · ');
  }

  companySel.addEventListener('change', () => {
    company = companies.find((c) => c.id === companySel.value);
    for (const s of sprites.values()) s.el.remove();
    sprites.clear();
    const u = new URL(location.href); u.searchParams.set('company', company.issuePrefix); history.replaceState(null, '', u);
    poll();
  });

  function currentTask(agentId, issues) {
    const mine = issues.filter((i) => i.assigneeAgentId === agentId);
    for (const st of ['in_progress', 'in_review', 'blocked', 'todo', 'backlog']) {
      const f = mine.find((i) => i.status === st);
      if (f) return f;
    }
    return null;
  }

  // Paperclip: an open issue whose review is waiting on the board (a pending question or
  // interaction for a human) means the agent needs you, even though Paperclip reports it idle.
  function askingBoard(agentId, issues) {
    for (const i of issues) {
      if (i.assigneeAgentId !== agentId || ['done', 'cancelled'].includes(i.status)) continue;
      const paths = (i.reviewAttention && i.reviewAttention.paths) || [];
      const p = paths.find((x) => /board|user|human/i.test(String(x && x.responder || '')));
      if (p) return { issue: i, reason: String(p.label || '') };
    }
    return null;
  }

  function sync(agents, issues) {
    layoutFor(agents.length);
    const sorted = [...agents].sort((a, b) => ((a._src || 0) - (b._src || 0)) || String(a.createdAt).localeCompare(String(b.createdAt)));
    const seen = new Set();
    sorted.forEach((a, idx) => {
      seen.add(a.id);
      let s = sprites.get(a.id);
      if (!s) {
        const h = hash(a.id);
        const spot = LOUNGE[idx % LOUNGE.length];
        s = {
          id: a.id, idx, seed: (h % 1000) / 100,
          // Looks come from the id, so an agent keeps its colours when others join or leave.
          // (>>> keeps the index positive: h is an unsigned 32-bit hash.)
          shirt: SHIRTS[(h >>> 6) % SHIRTS.length], hair: HAIRS[h % HAIRS.length], skin: SKINS[(h >>> 3) % SKINS.length],
          x: spot[0] * T, y: spot[1] * T,
          lounge: idx % LOUNGE.length, nextWander: performance.now() / 1000 + 5 + (h % 10),
          bubble: null, bubbleClass: '', bubbleUntil: 0, prevStatus: a.status,
        };
        const el = document.createElement('div');
        el.className = 'lbl';
        el.innerHTML = '<div class="bub" style="display:none"></div><div class="name"></div>';
        labelsEl.appendChild(el);
        s.el = el;
        sprites.set(a.id, s);
      }
      s.idx = idx;
      s.desk = DESKS[idx % DESKS.length];
      s.name = a.name;
      s.role = a.title || a.role || '';
      s.status = a.status;
      s.error = a.errorReason || '';
      s.spent = Number(a.spentMonthlyCents) || 0; s.budget = Number(a.budgetMonthlyCents) || 0;
      s.task = a.task !== undefined ? a.task : currentTask(a.id, issues);
      s.waitReason = '';
      s.ask = a.task === undefined && a.status !== 'error' ? askingBoard(a.id, issues) : null;
      if (s.ask && a.status === 'idle') { s.status = 'waiting'; s.task = s.ask.issue; s.waitReason = s.ask.reason; }
      if (s.prevStatus === 'running' && s.status === 'idle') setBubble(s, L.done, 'ok', 6);
      s.prevStatus = s.status;
      s.el.querySelector('.name').textContent = s.name;
    });
    for (const [id, s] of sprites) if (!seen.has(id)) { s.el.remove(); sprites.delete(id); }
    handOffs(issues);
    renderCards();
  }

  // Hand-offs: when an issue moves from one agent to another between two polls, both walk to
  // the lounge table for a few seconds, and the one handing over says what it passes on.
  const assignees = new Map();          // issue identifier -> agent id at the last poll
  const MEET = [[17.4, 10.3], [19.4, 10.3]];
  function handOffs(issues) {
    const now = performance.now() / 1000;
    for (const i of issues) {
      if (!i.identifier || !('assigneeAgentId' in i)) continue;
      const before = assignees.get(i.identifier);
      assignees.set(i.identifier, i.assigneeAgentId);
      if (!before || !i.assigneeAgentId || before === i.assigneeAgentId) continue;
      const from = sprites.get(before), to = sprites.get(i.assigneeAgentId);
      if (!from || !to || from === to) continue;
      from.meetUntil = to.meetUntil = now + 9;
      from.meetSpot = MEET[0]; to.meetSpot = MEET[1];
      setBubble(from, L.handoff(i.identifier, to.name), '', 8);
      setBubble(to, '🤝', '', 8);
    }
  }

  function setBubble(s, text, cls = '', secs = 4) {
    s.bubble = text; s.bubbleClass = cls; s.bubbleUntil = performance.now() / 1000 + secs;
  }

  function taskLink(t) {
    const label = esc(t.identifier);
    if (t.url) return `<a href="${esc(t.url)}" target="_blank" rel="noopener">${label || '↗'}</a>`;
    // Only Paperclip issues (which carry assigneeAgentId) link into Paperclip.
    if (!paperclipUrl || DEMO || !company || !('assigneeAgentId' in t)) return label;
    const target = EMBED ? '_top' : '_blank';   // inside Paperclip, open the issue in Paperclip itself
    return `<a href="${esc(paperclipUrl)}/${esc(company.issuePrefix)}/issues/${esc(t.identifier)}" target="${target}" rel="noopener">${label}</a>`;
  }

  // Monthly spend from Paperclip, when it reports any: "$4.20 / $20.00", amber from 80 %, red at 100 %.
  const money = (cents) => new Intl.NumberFormat(lang, { style: 'currency', currency: 'USD' }).format(cents / 100);
  function spendHtml(s) {
    if (!s.spent && !s.budget) return '';
    const share = s.budget ? s.spent / s.budget : 0;
    const col = share >= 1 ? '#ff8a8a' : share >= 0.8 ? '#ffd27a' : 'var(--muted)';
    const text = s.budget ? L.spend(money(s.spent), money(s.budget)) : L.spendNoBudget(money(s.spent));
    return ` · <span class="spend" style="color:${col}" title="${esc(L.spendTitle)}">${esc(text)}</span>`;
  }

  function renderCards() {
    const list = [...sprites.values()].sort((a, b) => a.idx - b.idx);
    cardsEl.innerHTML = list.map((s) => {
      const t = s.task;
      const taskHtml = t ? `${taskLink(t)} ${esc(t.title)}` : `<span style="color:var(--muted)">${L.noTask}</span>`;
      const err = s.status === 'error' && s.error ? `<div class="st" style="color:#ffb3b8">${esc(s.error)}</div>`
        : s.status === 'waiting' && s.waitReason ? `<div class="st" style="color:#ffe08a">${esc(s.waitReason)}</div>`
        : s.ask ? `<div class="st" style="color:#ffe08a">✋ ${L.asks} ${taskLink(s.ask.issue)} ${esc(s.ask.issue.title)}</div>` : '';
      return `<div class="card"><div class="top"><span class="sw" style="background:${s.shirt}"></span><b>${esc(s.name)}</b></div>
        <div class="role">${esc(s.role)}${spendHtml(s)}</div>
        <div class="st"><span class="pill p-${esc(s.status)}">${esc(L[s.status] || s.status)}</span>${taskHtml}</div>${err}</div>`;
    }).join('');
  }

  // ---------- movement ----------
  function targetFor(s, now) {
    if (s.meetUntil > now) return [s.meetSpot[0] * T, s.meetSpot[1] * T, false];
    if (s.status === 'running' || s.status === 'error' || s.status === 'waiting') return [s.desk[0] * T + 22, s.desk[1] * T + 12, true];
    if (now > s.nextWander) {
      const used = new Set([...sprites.values()].filter((o) => o !== s).map((o) => o.lounge));
      const free = LOUNGE.map((_, i) => i).filter((i) => !used.has(i));
      if (free.length) s.lounge = free[Math.floor(Math.random() * free.length)];
      s.nextWander = now + 9 + Math.random() * 14;
      if (Math.random() < 0.35) setBubble(s, L.chatter[Math.floor(Math.random() * L.chatter.length)], '', 3);
    }
    const p = LOUNGE[s.lounge % LOUNGE.length];
    return [p[0] * T, p[1] * T, false];
  }

  function step(s, dt, now) {
    const [tx, ty, atDesk] = targetFor(s, now);
    // Walk through the doorway between the work area and the lounge
    const inWork = s.x < 14 * T, toWork = tx < 14 * T;
    let gx = tx, gy = ty;
    if (inWork !== toWork) {
      const doorX = 14 * T + 8, doorY = 7 * T;
      if (Math.abs(s.x - doorX) > 3 || Math.abs(s.y - doorY) > 3) { gx = doorX; gy = doorY; }
      else { s.x += inWork ? 6 : -6; }
    }
    const dx = gx - s.x, dy = gy - s.y, d = Math.hypot(dx, dy);
    if (d > 0.8) {
      const m = Math.min(d, 34 * dt);
      s.x += (dx / d) * m; s.y += (dy / d) * m;
      s.walking = true; s.dir = Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0;
    } else {
      s.walking = false;
    }
    s.seated = !s.walking && atDesk && Math.hypot(tx - s.x, ty - s.y) < 1.5;
    s.typing = s.seated && s.status === 'running';
  }

  // ---------- drawing ----------
  const rect = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };

  function drawRoom(t) {
    const hr = new Date().getHours();
    const night = hr < 7 || hr >= 20;
    for (let y = 2; y < CH / T; y++) for (let x = 0; x < 22; x++) {
      const lounge = x >= 15;
      rect((x + y) % 2 ? (lounge ? '#4a3d57' : '#3a3f56') : (lounge ? '#463a52' : '#363b51'), x * T, y * T, T, T);
    }
    rect('#5b4a6b', 16.5 * T, 6.3 * T, 4.6 * T, 3 * T);
    rect('#4b4f6b', 0, 0, CW, 2 * T);
    rect('#3a3d55', 0, 2 * T - 3, CW, 3);
    for (const wx of [1.5, 5.5, 9.5, 16.5]) {
      rect('#2c2f44', wx * T - 1, 5, 34, 18);
      rect(night ? '#1c2a4a' : '#8fc7ff', wx * T, 6, 32, 16);
      if (!night) { const cx = (t * 3 + wx * 11) % 44 - 8; rect('rgba(255,255,255,.85)', wx * T + cx, 11, 8, 3); rect('rgba(255,255,255,.85)', wx * T + cx + 2, 9, 4, 2); }
      else rect('#f5f1c8', wx * T + 24, 9, 3, 3);
      rect('#2c2f44', wx * T + 15, 6, 2, 16);
    }
    // wall clock
    rect('#e9e7f2', 13 * T, 7, 12, 12); rect('#4b4f6b', 13 * T + 1, 8, 10, 10);
    const now = new Date();
    const hand = (a, len) => { g.beginPath(); g.moveTo(13 * T + 6, 13); g.lineTo(13 * T + 6 + Math.sin(a) * len, 13 - Math.cos(a) * len); g.stroke(); };
    g.strokeStyle = '#e9e7f2'; g.lineWidth = 1;
    hand(((now.getHours() % 12) + now.getMinutes() / 60) / 12 * Math.PI * 2, 3);
    hand(now.getMinutes() / 60 * Math.PI * 2, 4);
    // glass partition with a doorway
    rect('rgba(160,200,255,.18)', 14 * T + 6, 2 * T, 4, 4 * T);
    rect('rgba(160,200,255,.18)', 14 * T + 6, 8 * T, 4, CH - 8 * T);
    rect('#6c7090', 14 * T + 6, 2 * T, 4, 2); rect('#6c7090', 14 * T + 6, 8 * T, 4, 2);
  }

  function loungeProps(t, list) {
    list.push({ z: 3.6 * T, f: () => {
      rect('#6a3f8f', 15.8 * T, 2.4 * T, 5 * T, 12); rect('#7d4fa6', 15.8 * T, 2.4 * T + 12, 5 * T, 8);
      for (let i = 0; i < 4; i++) rect('#9467bd', 16 * T + i * 19, 2.4 * T + 13, 16, 5);
    }});
    list.push({ z: 3.4 * T, f: () => {
      rect('#3b3e4d', 21.1 * T, 2.2 * T, 12, 20); rect('#23252f', 21.1 * T + 2, 2.2 * T + 8, 8, 6);
      rect(Math.floor(t * 2) % 2 ? '#ff5a5a' : '#8a2a2a', 21.1 * T + 9, 2.2 * T + 3, 2, 2);
    }});
    list.push({ z: 6.9 * T, f: () => {
      rect('#8b5a2b', 17 * T, 6.9 * T, 3.6 * T, 1.6 * T); rect('#6e4520', 17 * T, 8.5 * T, 3.6 * T, 3);
      rect('#e9e7f2', 17.4 * T, 7.2 * T, 10, 7); rect('#e9e7f2', 19.4 * T, 7.4 * T, 8, 6);
    }});
    const H = CH / T;
    for (const [px, py] of [[14.9, 2.3], [21.3, H - 1.4], [0.2, H - 0.9]]) list.push({ z: (py + 1) * T, f: () => {
      rect('#8b5a2b', px * T + 3, py * T + 10, 8, 6);
      rect('#3f9d55', px * T + 1, py * T, 12, 11); rect('#57b86b', px * T + 3, py * T - 3, 8, 6);
    }});
  }

  function drawDesk(d, s, t) {
    const x = d[0] * T, y = d[1] * T;
    const on = s && s.typing;
    const err = s && s.status === 'error' && s.seated;
    const wait = s && s.status === 'waiting' && s.seated;
    rect('#8b5a2b', x, y + 8, 34, 10); rect('#6e4520', x, y + 18, 34, 3);
    rect('#6e4520', x + 1, y + 21, 2, 6); rect('#6e4520', x + 31, y + 21, 2, 6);
    rect('#22252f', x + 3, y - 2, 14, 10);
    rect(err ? (Math.floor(t * 2) % 2 ? '#ff6b6b' : '#a33') : wait ? (Math.floor(t) % 2 ? '#e0a33b' : '#b07d20') : on ? '#5cc8f0' : '#3a4050', x + 4, y - 1, 12, 7);
    if (on) for (let i = 0; i < 3; i++) rect('rgba(255,255,255,.75)', x + 5, y + i * 2, (Math.floor(t * 9 + i * 4) % 9) + 1, 1);
    rect('#22252f', x + 9, y + 8, 2, 1);
    rect('#c9cbd6', x + 17, y + 10, 11, 2);
    if (on) rect('#ffffff', x + 17 + (Math.floor(t * 12) % 10), y + 10, 1, 1);
    rect('#f3f3f3', x + 29, y + 9, 3, 4); rect('#f3f3f3', x + 32, y + 10, 1, 2);
  }

  function drawChar(s, t) {
    const x = Math.round(s.x), y = Math.round(s.y);
    const bob = s.walking ? Math.floor(t * 8 + s.seed) % 2 : 0;
    rect('rgba(0,0,0,.25)', x - 4, y - 1, 8, 2);
    if (!s.seated) {
      const ph = s.walking ? Math.floor(t * 8 + s.seed) % 2 : 0;
      rect('#2b2f45', x - 3, y - 5, 2, ph ? 4 : 5);
      rect('#2b2f45', x + 1, y - 5, 2, ph ? 5 : 4);
    }
    rect(s.shirt, x - 4, y - 11 - bob, 8, 6);
    if (s.typing) {
      const a = Math.floor(t * 10 + s.seed) % 2;
      rect(s.skin, x - 5, y - 8 - bob - a, 2, 2);
      rect(s.skin, x + 3, y - 8 - bob - (1 - a), 2, 2);
    } else if (s.status === 'waiting' && s.seated) {
      // one hand up, waving
      const w = Math.floor(t * 3 + s.seed) % 2;
      rect(s.skin, x - 5, y - 10 - bob, 1, 4);
      rect(s.skin, x + 4 + w, y - 19 - bob, 2, 8);
    } else {
      rect(s.skin, x - 5, y - 10 - bob, 1, 4);
      rect(s.skin, x + 4, y - 10 - bob, 1, 4);
    }
    const slump = s.status === 'error' && s.seated ? 1 : 0;
    rect(s.skin, x - 3, y - 17 - bob + slump, 6, 6);
    rect(s.hair, x - 3, y - 18 - bob + slump, 6, 2);
    rect(s.hair, x - 3, y - 17 - bob + slump, 1, 2);
    rect(s.hair, x + 2, y - 17 - bob + slump, 1, 2);
    if (((t + s.seed) % 4) >= 0.14) {
      const ox = s.dir || 0;
      rect('#1a1a1a', x - 2 + ox, y - 14 - bob + slump, 1, 1);
      rect('#1a1a1a', x + 1 + ox, y - 14 - bob + slump, 1, 1);
    }
  }

  // ---------- themes ----------
  // A theme draws the office; movement, labels and cards are shared. 'pixel' is built in;
  // others live in public/themes/<id>.js, are loaded only when chosen, and register
  // themselves with window.CubicleThemes.register(). Coordinates are in office pixels
  // (22×13+ tiles of 16 px); a theme with scale > 1 gets a sharper canvas to draw on.
  const themes = {
    pixel: {
      id: 'pixel', name: { en: 'Pixel (classic)', tr: 'Piksel (klasik)' }, scale: 1, smooth: false,
      drawRoom: (c) => drawRoom(c.t),
      props: (c, list) => loungeProps(c.t, list),
      drawDesk: (c, d, s) => drawDesk(d, s, c.t),
      drawChar: (c, s) => drawChar(s, c.t),
    },
  };
  let theme = themes.pixel;
  let themeOpts = {};
  window.CubicleThemes = { register(t) { themes[t.id] = t; }, T };

  function placeLabels(now) {
    const k = cv.clientWidth / CW;
    // Keep bubbles narrower than the gap between neighbouring desks so they never overlap.
    const bubMax = Math.max(80, Math.floor(3.3 * T * k - 6)) + 'px';
    // In kiosk mode names and bubbles grow with the screen (11px at the default ~3x scale).
    if (KIOSK) labelsEl.style.fontSize = Math.max(11, Math.round(11 * k / 3)) + 'px';
    for (const s of sprites.values()) {
      s.el.style.left = (s.x * k) + 'px';
      s.el.style.top = ((s.y - 20) * k) + 'px';
      const b = s.el.querySelector('.bub');
      b.style.maxWidth = bubMax;
      let text = null, cls = '';
      if (s.bubble && now < s.bubbleUntil) { text = s.bubble; cls = s.bubbleClass; }
      else if (s.status === 'error' && s.seated) { text = L.errBubble; cls = 'err'; }
      else if (s.status === 'waiting' && s.seated) { text = L.waitBubble; cls = 'wait'; }
      else if (s.typing && s.ask && Math.floor(now / 3) % 2) { text = '✋ ' + (s.ask.issue.identifier || L.waiting); cls = 'wait'; }
      else if (s.typing && s.task) text = '⌨ ' + (s.task.identifier || s.task.title);
      else if (s.status === 'paused') text = 'zZ';
      if (text) { b.textContent = text; b.className = 'bub ' + cls; b.style.display = ''; }
      else b.style.display = 'none';
    }
  }

  let last = performance.now() / 1000;
  function frame() {
    const now = performance.now() / 1000;
    const dt = Math.min(0.1, now - last); last = now;
    g.setTransform(theme.scale, 0, 0, theme.scale, 0, 0);
    g.imageSmoothingEnabled = !!theme.smooth;
    g.clearRect(0, 0, CW, CH);
    const hr = new Date().getHours();
    const c = { g, t: now, T, CW, CH, night: hr < 7 || hr >= 20, opts: themeOpts, sprites, desks: DESKS, lounge: LOUNGE, company: officeName,
      anyError: [...sprites.values()].some((s) => s.status === 'error') };
    theme.drawRoom(c);
    const list = [];
    theme.props(c, list);
    const byDesk = new Map();
    for (const s of sprites.values()) { step(s, dt, now); byDesk.set(s.desk, s); }
    const deskCount = Math.max(4, Math.min(DESKS.length, Math.ceil(sprites.size / 4) * 4));
    DESKS.slice(0, deskCount).forEach((d) => list.push({ z: d[1] * T + 21, f: () => theme.drawDesk(c, d, byDesk.get(d)) }));
    for (const s of sprites.values()) list.push({ z: s.y, f: () => theme.drawChar(c, s) });
    list.sort((a, b) => a.z - b.z).forEach((o) => o.f());
    if (theme.overlay) theme.overlay(c);
    placeLabels(now);
    requestAnimationFrame(frame);
  }

  // ---------- settings ----------
  // Themes the settings panel offers. Options are listed here so the panel can show them
  // before the theme file is loaded.
  // Theme list: public/themes/index.json (id, name, options). Adding a theme is one .js file
  // plus one entry there; see docs/THEMES.md.
  let CATALOG = [{ id: 'pixel', name: themes.pixel.name, options: [] }];
  const tr = (o) => (o && (o[lang] || o.en)) || '';
  const STORE = 'cubicle.settings';
  let settings = { theme: 'pixel' };
  try { settings = { ...settings, ...JSON.parse(localStorage.getItem(STORE) || '{}') }; } catch (_) {}
  // URL parameters win, so a kiosk link always opens the same way.
  if (params.get('theme')) settings.theme = params.get('theme');
  async function loadCatalog() {
    try {
      const list = await (await fetch('themes/index.json', { cache: 'no-store' })).json();
      CATALOG = [CATALOG[0], ...list.filter((t) => t && /^[a-z0-9-]+$/.test(t.id) && t.id !== 'pixel').map((t) => ({ options: [], ...t }))];
    } catch (_) {}
    for (const c of CATALOG) for (const o of c.options) if (params.get(o.key)) settings[o.key] = params.get(o.key);
  }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(settings)); } catch (_) {} };

  const loadScript = (src) => new Promise((resolve) => {
    const el = document.createElement('script');
    el.src = src; el.onload = () => resolve(true); el.onerror = () => resolve(false);
    document.head.appendChild(el);
  });
  let kitLoaded = null;
  async function loadTheme(id) {
    if (themes[id]) return themes[id];
    if (!/^[a-z0-9-]+$/.test(id)) return themes.pixel;
    // kit.js holds the shared drawing helpers (people, desks, windows...) most themes use.
    kitLoaded = kitLoaded || loadScript('themes/kit.js');
    await kitLoaded;
    await loadScript(`themes/${id}.js`);
    return themes[id] || themes.pixel;
  }

  async function applySettings() {
    const entry = CATALOG.find((c) => c.id === settings.theme) || CATALOG[0];
    themeOpts = {};
    for (const o of entry.options) themeOpts[o.key] = o.values.some((v) => v[0] === settings[o.key]) ? settings[o.key] : o.values[0][0];
    theme = await loadTheme(entry.id);
    if (theme.setup) theme.setup(themeOpts);
    resizeCanvas();
    renderSettings();
  }

  const gear = document.getElementById('gear');
  const panel = document.getElementById('settings');
  gear.title = L.settings; gear.setAttribute('aria-label', L.settings);
  gear.addEventListener('click', () => {
    panel.hidden = !panel.hidden; gear.setAttribute('aria-expanded', String(!panel.hidden));
  });
  document.addEventListener('click', (e) => {
    if (!panel.hidden && !panel.contains(e.target) && e.target !== gear) { panel.hidden = true; gear.setAttribute('aria-expanded', 'false'); }
  });

  function renderSettings() {
    const entry = CATALOG.find((c) => c.id === theme.id) || CATALOG[0];
    const sel = (key, label, values, cur) => `<label for="set-${key}">${esc(label)}</label><select id="set-${key}" data-key="${key}">` +
      values.map(([v, n]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(tr(n))}</option>`).join('') + '</select>';
    panel.innerHTML = sel('theme', L.theme, CATALOG.map((c) => [c.id, c.name]), entry.id) +
      entry.options.map((o) => sel(o.key, tr(o.label), o.values, themeOpts[o.key])).join('') +
      `<button type="button" id="set-copy">${esc(L.copyLink)}</button><div class="note">${esc(L.settingsNote)}</div>`;
    panel.querySelectorAll('select').forEach((el) => el.addEventListener('change', () => {
      settings[el.dataset.key] = el.value; save(); applySettings();
    }));
    panel.querySelector('#set-copy').addEventListener('click', async (e) => {
      const u = new URL(location.href);
      u.searchParams.set('theme', entry.id);
      for (const o of entry.options) u.searchParams.set(o.key, themeOpts[o.key]);
      try { await navigator.clipboard.writeText(u.toString()); e.target.textContent = L.copied; }
      catch (_) { prompt(L.copyLink, u.toString()); }
      setTimeout(() => { e.target.textContent = L.copyLink; }, 1500);
    });
  }

  resizeCanvas();
  loadCatalog().then(applySettings);
  init();
})();
</script>
</body>
</html>
